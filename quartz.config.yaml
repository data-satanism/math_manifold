# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Math for AI
  pageTitleSuffix: " — связанная база знаний"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: ru-RU
  baseUrl: data-satanism.github.io/math_manifold
  ignorePatterns:
    - .obsidian
    - 00_inbox
    - 90_admin
    - _private
    - "**/*.pdf"
    - "**/*.ipynb"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Manrope
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f8fafc"
        lightgray: "#e2e8f0"
        gray: "#94a3b8"
        darkgray: "#334155"
        dark: "#172033"
        secondary: "#2563eb"
        tertiary: "#0f766e"
        highlight: rgba(37, 99, 235, 0.12)
        textHighlight: "#fde68a"
      darkMode:
        light: "#111827"
        lightgray: "#334155"
        gray: "#64748b"
        darkgray: "#e2e8f0"
        dark: "#f8fafc"
        secondary: "#60a5fa"
        tertiary: "#5eead4"
        highlight: rgba(96, 165, 250, 0.16)
        textHighlight: "#854d0e"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority: [frontmatter, git, filesystem]
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme: { light: github-light, dark: github-dark }
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout: { position: right, priority: 30 }
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: false
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options: { renderEngine: katex }
    order: 80
  - source: github:quartz-community/citations
    enabled: true
    options:
      bibliographyFile: ./bibliography.bib
      suppressBibliography: false
      linkCitations: true
      csl: apa
      prettyLink: true
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: false
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options: { enableSiteMap: true, enableRSS: true }
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout: { position: left, priority: 50 }
  - source: github:quartz-community/graph
    enabled: true
    layout: { position: right, priority: 10 }
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions: { grow: true }
  - source: github:quartz-community/backlinks
    enabled: true
    layout: { position: right, priority: 50 }
  - source: github:quartz-community/article-title
    enabled: true
    layout: { position: beforeBody, priority: 10 }
  - source: github:quartz-community/content-meta
    enabled: true
    layout: { position: beforeBody, priority: 20 }
  - source: github:quartz-community/page-title
    enabled: true
    layout: { position: left, priority: 10 }
  - source: github:quartz-community/darkmode
    enabled: true
    layout: { position: left, priority: 30, group: toolbar }
  - source: github:quartz-community/reader-mode
    enabled: true
    layout: { position: left, priority: 35, group: toolbar }
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout: { position: beforeBody, priority: 5, condition: not-index }
  - source: github:quartz-community/footer
    enabled: true
    options:
      links: { Source: "https://github.com/data-satanism/math_manifold" }
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout: { position: left, priority: 25, display: mobile-only }
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties: [description, tags, aliases, level]
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 5
    layout: { position: beforeBody, priority: 15, display: all }
layout:
  groups:
    toolbar: { priority: 35, direction: row, gap: 0.5rem }
  byPageType:
    "404": { positions: { beforeBody: [], left: [], right: [] } }
    content: {}
    folder: { exclude: [reader-mode], positions: { right: [] } }
    tag: { exclude: [reader-mode], positions: { right: [] } }
