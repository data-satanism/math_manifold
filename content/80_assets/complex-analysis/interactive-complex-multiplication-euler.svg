<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Комплексное умножение как поворот и масштабирование</title>
  <desc id="desc">Исходный вектор поворачивается на угол фи и растягивается в ро раз; справа показаны фазовый признак и разрыв аргумента.</desc>
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#527da3"/></marker>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#d97732"/></marker>
    <style>.t{font:700 30px system-ui;fill:#17324d}.h{font:650 22px system-ui;fill:#17324d}.p{font:18px system-ui;fill:#17324d}.m{font:italic 21px serif;fill:#17324d}.box{fill:#fff;stroke:#b7c7d4;stroke-width:2}.axis{stroke:#17324d;stroke-width:2}.blue{stroke:#527da3;stroke-width:5;fill:none}.orange{stroke:#d97732;stroke-width:5;fill:none}</style>
  </defs>
  <rect width="1200" height="680" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="t">Комплексное умножение: геометрический механизм</text>
  <rect x="20" y="75" width="560" height="560" rx="14" class="box"/><rect x="600" y="75" width="580" height="270" rx="14" class="box"/><rect x="600" y="365" width="580" height="270" rx="14" class="box"/>
  <text x="45" y="112" class="h">A. Поворот + масштабирование</text>
  <line x1="90" y1="390" x2="520" y2="390" class="axis"/><line x1="290" y1="570" x2="290" y2="150" class="axis"/>
  <circle cx="290" cy="390" r="150" fill="none" stroke="#d6e0e7" stroke-width="2"/>
  <line x1="290" y1="390" x2="430" y2="310" class="blue" marker-end="url(#b)"/><text x="442" y="306" class="m">z</text>
  <line x1="290" y1="390" x2="410" y2="190" class="orange" marker-end="url(#a)"/><text x="420" y="184" class="m">ρeⁱφz</text>
  <path d="M370 345 A92 92 0 0 0 340 310" fill="none" stroke="#d97732" stroke-width="3"/><text x="365" y="320" class="m">φ</text>
  <text x="65" y="605" class="p">Модули перемножаются, углы складываются.</text>
  <text x="625" y="112" class="h">B. Понятный образ: стрелка часов</text>
  <circle cx="755" cy="220" r="82" fill="#edf3f7" stroke="#527da3" stroke-width="2"/><line x1="755" y1="220" x2="795" y2="165" class="blue"/><line x1="755" y1="220" x2="825" y2="245" class="orange"/>
  <text x="865" y="195" class="p">Последовательные повороты</text><text x="865" y="225" class="m">eⁱφ¹eⁱφ² = eⁱ⁽φ¹⁺φ²⁾</text><text x="865" y="260" class="p">длины стрелок не меняются при ρ = 1</text>
  <text x="625" y="402" class="h">C. Перенос и граница</text>
  <line x1="670" y1="560" x2="865" y2="560" class="axis"/><line x1="690" y1="590" x2="690" y2="430" class="axis"/><line x1="690" y1="560" x2="810" y2="460" class="blue" marker-end="url(#b)"/>
  <text x="705" y="445" class="p">спектральный признак:</text><text x="730" y="590" class="p">амплитуда + фаза</text>
  <circle cx="1030" cy="510" r="78" fill="none" stroke="#527da3" stroke-width="2"/><line x1="952" y1="510" x2="1108" y2="510" stroke="#d97732" stroke-width="5"/><text x="940" y="610" class="p">разрыв главного аргумента</text>
</svg>
