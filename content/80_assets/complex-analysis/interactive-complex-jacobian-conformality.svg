<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Комплексный якобиан как локальное подобие</title>
  <desc id="desc">Конформный якобиан переводит окружность в окружность, анизотропный — в эллипс, нулевой — в точку.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#527da3"/></marker><style>.t{font:700 30px system-ui;fill:#17324d}.h{font:650 21px system-ui;fill:#17324d}.p{font:17px system-ui;fill:#17324d}.box{fill:#fff;stroke:#b7c7d4;stroke-width:2}.b{stroke:#527da3;stroke-width:4;fill:none}.a{stroke:#d97732;stroke-width:4;fill:none}.axis{stroke:#17324d;stroke-width:2}</style></defs>
  <rect width="1200" height="680" fill="#fff"/><text x="600" y="46" text-anchor="middle" class="t">Локальная геометрия комплексной производной</text>
  <rect x="20" y="75" width="560" height="560" rx="14" class="box"/><rect x="600" y="75" width="580" height="270" rx="14" class="box"/><rect x="600" y="365" width="580" height="270" rx="14" class="box"/>
  <text x="45" y="112" class="h">A. Конформный режим: σ₁ = σ₂</text>
  <circle cx="175" cy="330" r="105" fill="#edf3f7" class="b"/><g stroke="#94adbf"><line x1="175" y1="330" x2="280" y2="330"/><line x1="175" y1="330" x2="175" y2="225"/><line x1="175" y1="330" x2="101" y2="256"/><line x1="175" y1="330" x2="249" y2="256"/></g>
  <line x1="300" y1="330" x2="365" y2="330" class="b" marker-end="url(#arr)"/><circle cx="455" cy="330" r="132" fill="#edf3f7" class="a"/><g stroke="#d7a27f"><line x1="455" y1="330" x2="569" y2="264"/><line x1="455" y1="330" x2="521" y2="216"/><line x1="455" y1="330" x2="389" y2="216"/></g>
  <text x="70" y="520" class="p">круг возмущений</text><text x="390" y="520" class="p">поворот + единый масштаб</text><text x="92" y="575" class="p">J = [[a, −b], [b, a]]</text>
  <text x="625" y="112" class="h">B. Перенос: одинаковая линейка</text><line x1="650" y1="220" x2="880" y2="220" stroke="#17324d" stroke-width="8"/><g stroke="#fff" stroke-width="2"><line x1="670" y1="210" x2="670" y2="230"/><line x1="710" y1="210" x2="710" y2="230"/><line x1="750" y1="210" x2="750" y2="230"/><line x1="790" y1="210" x2="790" y2="230"/><line x1="830" y1="210" x2="830" y2="230"/></g>
  <circle cx="1010" cy="215" r="8" fill="#17324d"/><g class="b"><line x1="1010" y1="215" x2="1110" y2="215"/><line x1="1010" y1="215" x2="1060" y2="128"/><line x1="1010" y1="215" x2="960" y2="128"/></g><text x="650" y="300" class="p">один локальный масштаб во всех направлениях</text>
  <text x="625" y="402" class="h">C. Два отказа</text><circle cx="730" cy="515" r="75" class="b"/><ellipse cx="910" cy="515" rx="115" ry="52" class="a"/><line x1="805" y1="515" x2="790" y2="515" class="b" marker-end="url(#arr)"/><text x="660" y="615" class="p">анизотропия: круг → эллипс</text>
  <circle cx="1080" cy="515" r="75" class="b"/><circle cx="1080" cy="515" r="8" fill="#d97732"/><text x="1000" y="615" class="p">J = 0: коллапс</text>
</svg>
