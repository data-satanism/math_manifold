<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Преобразования Мёбиуса сохраняют обобщённые окружности</title>
  <desc id="desc">Сфера Римана объединяет прямые и окружности; справа показано действие на гиперболической геодезической и опасность полюса.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#d97732"/></marker><style>.t{font:700 30px system-ui;fill:#17324d}.h{font:650 21px system-ui;fill:#17324d}.p{font:17px system-ui;fill:#17324d}.box{fill:#fff;stroke:#b7c7d4;stroke-width:2}.b{stroke:#527da3;stroke-width:4;fill:none}.a{stroke:#d97732;stroke-width:4;fill:none}</style></defs>
  <rect width="1200" height="680" fill="#fff"/><text x="600" y="46" text-anchor="middle" class="t">Один класс: окружности и прямые</text>
  <rect x="20" y="75" width="370" height="560" rx="14" class="box"/><rect x="415" y="75" width="370" height="560" rx="14" class="box"/><rect x="810" y="75" width="370" height="560" rx="14" class="box"/>
  <text x="45" y="112" class="h">A. Сфера Римана</text><circle cx="205" cy="305" r="135" fill="#edf3f7" stroke="#527da3" stroke-width="3"/><ellipse cx="205" cy="305" rx="135" ry="46" class="b"/><circle cx="205" cy="170" r="8" fill="#d97732"/><text x="220" y="170" class="p">∞</text>
  <path d="M80 505 Q205 450 330 505" class="b"/><line x1="205" y1="170" x2="285" y2="480" stroke="#9aafbf" stroke-dasharray="7 6"/><text x="68" y="560" class="p">Прямая — окружность через ∞</text>
  <text x="440" y="112" class="h">B. Инверсия</text><circle cx="525" cy="330" r="85" class="b"/><circle cx="675" cy="330" r="120" class="a"/><line x1="525" y1="330" x2="675" y2="330" stroke="#d97732" stroke-width="3" marker-end="url(#arr)"/><text x="465" y="500" class="p">обобщённая окружность</text><text x="640" y="500" class="p">её образ</text><text x="455" y="560" class="p">Центр и радиус меняются, класс сохраняется.</text>
  <text x="835" y="112" class="h">C. Перенос и граница</text><circle cx="930" cy="320" r="120" fill="#edf3f7" stroke="#527da3" stroke-width="3"/><path d="M850 410 Q930 155 1010 410" class="b"/><circle cx="930" cy="320" r="7" fill="#17324d"/><text x="835" y="480" class="p">геодезическая диска Пуанкаре</text>
  <line x1="1075" y1="185" x2="1075" y2="430" class="a"/><circle cx="1075" cy="305" r="10" fill="#d97732"/><text x="1025" y="160" class="p">полюс</text><text x="1018" y="470" class="p">резкое растяжение</text><text x="835" y="570" class="p">Симметрия сохраняет структуру, но не евклидовы длины.</text>
</svg>
