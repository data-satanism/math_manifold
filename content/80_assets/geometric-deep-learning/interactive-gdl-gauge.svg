<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Калибровки и параллельный перенос</title><desc id="d">Статическая запасная версия интерактивной математической схемы.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9772f"/></marker></defs><rect width="1000" height="560" fill="white"/><rect x="12" y="12" width="976" height="536" rx="14" fill="none" stroke="#aebdc7"/><text x="42" y="58" font-family="system-ui" font-size="28" font-weight="700" fill="#20313d">Калибровки и параллельный перенос</text><g font-family="system-ui" font-size="20" fill="#20313d"><path d="M80 350C280 80 650 470 900 170" fill="none" stroke="#dbe6ed" stroke-width="16"/><g stroke="#3f6480" stroke-width="4"><path d="M170 280l55 -15M350 235l40 40M540 315l15 55M730 290l-30 50"/></g><path d="M170 280L730 290" stroke="#d9772f" stroke-width="3" stroke-dasharray="8 7"/><text x="220" y="470">связность согласует локальные калибровки</text></g><rect x="42" y="500" width="916" height="34" rx="8" fill="#f4f7f9"/><text x="58" y="523" font-family="system-ui" font-size="17" fill="#20313d">Интерактив позволяет менять параметры; эта версия сохраняет центральную геометрическую идею.</text></svg>