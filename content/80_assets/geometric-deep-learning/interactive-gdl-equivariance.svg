<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Коммутативная диаграмма эквивариантности</title><desc id="d">Статическая запасная версия интерактивной математической схемы.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9772f"/></marker></defs><rect width="1000" height="560" fill="white"/><rect x="12" y="12" width="976" height="536" rx="14" fill="none" stroke="#aebdc7"/><text x="42" y="58" font-family="system-ui" font-size="28" font-weight="700" fill="#20313d">Коммутативная диаграмма эквивариантности</text><g font-family="system-ui" font-size="20" fill="#20313d"><rect x="90" y="120" width="140" height="80" rx="12" fill="#dbe6ed"/><rect x="720" y="120" width="140" height="80" rx="12" fill="#dbe6ed"/><rect x="90" y="360" width="140" height="80" rx="12" fill="#dbe6ed"/><rect x="720" y="360" width="140" height="80" rx="12" fill="#fde6df"/><path d="M230 160H710M230 400H710M160 200V350M790 200V350" stroke="#3f6480" stroke-width="4" marker-end="url(#a)"/><text x="420" y="292">два пути совпадают</text></g><rect x="42" y="500" width="916" height="34" rx="8" fill="#f4f7f9"/><text x="58" y="523" font-family="system-ui" font-size="17" fill="#20313d">Интерактив позволяет менять параметры; эта версия сохраняет центральную геометрическую идею.</text></svg>