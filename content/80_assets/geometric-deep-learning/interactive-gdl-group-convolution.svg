<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Групповая свёртка</title><desc id="d">Статическая запасная версия интерактивной математической схемы.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9772f"/></marker></defs><rect width="1000" height="560" fill="white"/><rect x="12" y="12" width="976" height="536" rx="14" fill="none" stroke="#aebdc7"/><text x="42" y="58" font-family="system-ui" font-size="28" font-weight="700" fill="#20313d">Групповая свёртка</text><g font-family="system-ui" font-size="20" fill="#20313d"><circle cx="310" cy="270" r="165" fill="none" stroke="#9eb5c5" stroke-width="5"/><g fill="#3f6480"><circle cx="475" cy="270" r="7"/><circle cx="452" cy="352" r="11"/><circle cx="392" cy="412" r="15"/><circle cx="310" cy="434" r="7"/><circle cx="228" cy="412" r="11"/><circle cx="167" cy="352" r="15"/><circle cx="146" cy="270" r="7"/><circle cx="168" cy="188" r="11"/><circle cx="228" cy="127" r="15"/><circle cx="310" cy="106" r="7"/><circle cx="393" cy="128" r="11"/><circle cx="453" cy="189" r="15"/></g><path d="M520 270H680" stroke="#d9772f" stroke-width="4" marker-end="url(#a)"/><circle cx="790" cy="270" r="110" fill="none" stroke="#d9772f" stroke-width="5"/><text x="625" y="450">сдвиг входа → сдвиг выхода</text></g><rect x="42" y="500" width="916" height="34" rx="8" fill="#f4f7f9"/><text x="58" y="523" font-family="system-ui" font-size="17" fill="#20313d">Интерактив позволяет менять параметры; эта версия сохраняет центральную геометрическую идею.</text></svg>