<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Орбиты и инварианты</title><desc id="d">Статическая запасная версия интерактивной математической схемы.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9772f"/></marker></defs><rect width="1000" height="560" fill="white"/><rect x="12" y="12" width="976" height="536" rx="14" fill="none" stroke="#aebdc7"/><text x="42" y="58" font-family="system-ui" font-size="28" font-weight="700" fill="#20313d">Орбиты и инварианты</text><g font-family="system-ui" font-size="20" fill="#20313d"><circle cx="310" cy="235" r="135" fill="none" stroke="#9eb5c5" stroke-width="5"/><g fill="#3f6480"><circle cx="445" cy="235" r="9"/><circle cx="405" cy="330" r="9"/><circle cx="310" cy="369" r="9"/><circle cx="215" cy="330" r="9"/><circle cx="176" cy="235" r="9"/><circle cx="215" cy="140" r="9"/><circle cx="310" cy="101" r="9"/><circle cx="405" cy="140" r="9"/></g><circle cx="730" cy="235" r="18" fill="#d9772f"/><path d="M470 235H690" stroke="#d9772f" stroke-width="4" marker-end="url(#a)"/></g><rect x="42" y="500" width="916" height="34" rx="8" fill="#f4f7f9"/><text x="58" y="523" font-family="system-ui" font-size="17" fill="#20313d">Интерактив позволяет менять параметры; эта версия сохраняет центральную геометрическую идею.</text></svg>