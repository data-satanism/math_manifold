<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Геодезическая на сфере</title><desc id="d">Статическая запасная версия интерактивной математической схемы.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9772f"/></marker></defs><rect width="1000" height="560" fill="white"/><rect x="12" y="12" width="976" height="536" rx="14" fill="none" stroke="#aebdc7"/><text x="42" y="58" font-family="system-ui" font-size="28" font-weight="700" fill="#20313d">Геодезическая на сфере</text><g font-family="system-ui" font-size="20" fill="#20313d"><circle cx="420" cy="270" r="190" fill="#edf3f7" stroke="#3f6480" stroke-width="4"/><path d="M260 320Q420 65 585 320" fill="none" stroke="#d9772f" stroke-width="6"/><path d="M260 320L585 320" stroke="#20313d" stroke-width="3" stroke-dasharray="9 7"/><circle cx="260" cy="320" r="11" fill="#d9772f"/><circle cx="585" cy="320" r="11" fill="#d9772f"/><text x="650" y="210">геодезическая</text><text x="650" y="315">хорда</text></g><rect x="42" y="500" width="916" height="34" rx="8" fill="#f4f7f9"/><text x="58" y="523" font-family="system-ui" font-size="17" fill="#20313d">Интерактив позволяет менять параметры; эта версия сохраняет центральную геометрическую идею.</text></svg>