<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Передача сообщений и сверхсглаживание</title><desc id="d">Статическая запасная версия интерактивной математической схемы.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9772f"/></marker></defs><rect width="1000" height="560" fill="white"/><rect x="12" y="12" width="976" height="536" rx="14" fill="none" stroke="#aebdc7"/><text x="42" y="58" font-family="system-ui" font-size="28" font-weight="700" fill="#20313d">Передача сообщений и сверхсглаживание</text><g font-family="system-ui" font-size="20" fill="#20313d"><g stroke="#9eb5c5" stroke-width="4"><path d="M170 130L390 100L560 230L440 410L200 390L90 250Z"/><path d="M170 130L200 390M390 100L440 410"/></g><g fill="#3f6480"><circle cx="170" cy="130" r="20"/><circle cx="390" cy="100" r="20"/><circle cx="560" cy="230" r="20"/><circle cx="440" cy="410" r="20"/><circle cx="200" cy="390" r="20"/><circle cx="90" cy="250" r="20"/></g><path d="M650 230H880" stroke="#d9772f" stroke-width="16"/><text x="650" y="190">различимость уменьшается</text></g><rect x="42" y="500" width="916" height="34" rx="8" fill="#f4f7f9"/><text x="58" y="523" font-family="system-ui" font-size="17" fill="#20313d">Интерактив позволяет менять параметры; эта версия сохраняет центральную геометрическую идею.</text></svg>