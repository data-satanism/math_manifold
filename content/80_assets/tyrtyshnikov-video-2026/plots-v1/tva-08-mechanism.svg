    <text style="font: 11px 'DejaVu Sans'" transform="translate(761.303829 132.878528)">Условие Крускала выполнено.</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(761.303829 145.196122)">A и B имеют по 4 столбца,</text>
