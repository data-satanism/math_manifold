<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
<title id="t">Методы Ньютона и секущих</title><desc id="d">Касательная и секущая приближают корень, а область притяжения ограничивает допустимый старт.</desc>
<defs><style>.p{fill:#fff;stroke:#c8d6e2;stroke-width:1.5}.i{stroke:#17324d;fill:none;stroke-width:2}.m{stroke:#6e879b;fill:none;stroke-width:1.3;stroke-dasharray:6 5}.a{stroke:#e66b19;fill:none;stroke-width:3}.dot{fill:#e66b19}.txt{fill:#17324d;font:18px system-ui,sans-serif}.ttl{fill:#17324d;font:700 24px system-ui,sans-serif}.small{fill:#6e879b;font:15px system-ui,sans-serif}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="#e66b19"/></marker></defs>
<rect width="1000" height="560" fill="#fff"/><rect class="p" x="20" y="20" width="465" height="245" rx="10"/><rect class="p" x="515" y="20" width="465" height="245" rx="10"/><rect class="p" x="20" y="295" width="465" height="245" rx="10"/><rect class="p" x="515" y="295" width="465" height="245" rx="10"/>
<text class="ttl" x="42" y="55">А. Касательная</text><path class="i" d="M55 215C130 60 260 75 450 215"/><path class="i" d="M55 220H455"/><circle class="dot" cx="150" cy="105" r="6"/><path class="m" d="M150 105L250 220"/><circle class="dot" cx="250" cy="220" r="6"/><path class="a" marker-end="url(#arr)" d="M250 230H345"/><text class="small" x="120" y="245">ошибка быстро сжимается у простого корня</text>
<text class="ttl" x="537" y="55">Б. Область притяжения</text><rect x="680" y="70" width="130" height="155" fill="#edf3f7"/><path class="i" d="M535 190C615 55 690 235 755 150S900 60 960 175"/><path class="a" marker-end="url(#arr)" d="M600 210C630 170 675 185 730 220"/><path class="a" marker-end="url(#arr)" d="M910 190C925 140 945 105 965 78"/><text class="small" x="684" y="92">устойчивый старт</text><text class="small" x="835" y="238">неудачный старт</text>
<text class="ttl" x="42" y="330">В. Секущая</text><path class="i" d="M55 490C140 330 280 350 450 490"/><path class="i" d="M55 495H455"/><circle class="dot" cx="135" cy="390" r="6"/><circle class="dot" cx="245" cy="385" r="6"/><path class="m" d="M135 390L330 495"/><circle class="dot" cx="330" cy="495" r="6"/><text class="small" x="95" y="522">две точки заменяют производную</text>
<text class="ttl" x="537" y="330">Г. Неявный слой</text><rect x="590" y="365" width="210" height="70" rx="10" fill="#edf3f7" stroke="#6e879b"/><text class="txt" x="635" y="407">преобразование</text><circle cx="875" cy="400" r="32" fill="#fff" stroke="#17324d" stroke-width="2"/><text class="txt" x="864" y="407">z</text><path class="i" d="M800 400H840"/><path class="a" marker-end="url(#arr)" d="M875 432V485H610V438"/><text class="small" x="700" y="510">поиск равновесия</text>
</svg>
