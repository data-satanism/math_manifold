<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Равномерные и чебышёвские узлы</title><desc id="d">Статическая схема феномена Рунге и переноса идеи на размещение экспериментов.</desc>
<defs><style>.h{font:700 28px system-ui;fill:#263746}.p{font:600 19px system-ui;fill:#263746}.s{font:16px system-ui;fill:#5f7482}.line{fill:none;stroke:#66869b;stroke-width:4}.accent{fill:none;stroke:#d27a37;stroke-width:4}.grid{stroke:#dbe4e9;stroke-width:1}.box{fill:#f4f7f9;stroke:#aebfc9;stroke-width:1.5}.bad{fill:#fff4f2;stroke:#a94f4f;stroke-width:2}.dot{fill:#263746}</style></defs>
<rect width="1200" height="680" fill="white"/><text x="36" y="48" class="h">Узлы интерполяции управляют краевой устойчивостью</text>
<g transform="translate(36 82)"><rect width="550" height="245" rx="8" class="box"/><text x="18" y="32" class="p">A. Равномерная сетка</text><path d="M25 200H525M25 55V200" class="grid"/><path d="M25 170 C90 150 135 85 185 145 S285 210 335 130 S430 40 525 160" class="line"/><path d="M25 165 C85 100 125 225 175 120 S270 25 325 155 S440 270 525 65" class="accent"/><g class="dot"><circle cx="25" cy="165" r="5"/><circle cx="108" cy="118" r="5"/><circle cx="192" cy="136" r="5"/><circle cx="275" cy="174" r="5"/><circle cx="358" cy="112" r="5"/><circle cx="442" cy="92" r="5"/><circle cx="525" cy="160" r="5"/></g><text x="25" y="228" class="s">Крайние пики растут при увеличении степени</text></g>
<g transform="translate(614 82)"><rect width="550" height="245" rx="8" class="box"/><text x="18" y="32" class="p">B. Узлы Чебышёва</text><path d="M25 200H525M25 55V200" class="grid"/><path d="M25 170 C90 150 135 85 185 145 S285 210 335 130 S430 40 525 160" class="line"/><path d="M25 171 C90 148 135 88 185 143 S285 207 335 132 S430 43 525 158" class="accent"/><g class="dot"><circle cx="28" cy="170" r="5"/><circle cx="57" cy="158" r="5"/><circle cx="130" cy="94" r="5"/><circle cx="275" cy="174" r="5"/><circle cx="420" cy="52" r="5"/><circle cx="493" cy="120" r="5"/><circle cx="522" cy="158" r="5"/></g><text x="25" y="228" class="s">Сгущение у границы подавляет опасные колебания</text></g>
<path d="M300 342V382M890 342V382" stroke="#66869b" stroke-width="2" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66869b"/></marker></defs>
<g transform="translate(36 390)"><rect width="740" height="238" rx="8" class="box"/><text x="18" y="34" class="p">C. Перенос: размещение дорогих экспериментов</text><text x="22" y="68" class="s">Больше контрольных запусков в чувствительных областях параметра</text><path d="M55 170H690" stroke="#66869b" stroke-width="3"/><g fill="#d27a37"><circle cx="70" cy="170" r="9"/><circle cx="105" cy="170" r="8"/><circle cx="175" cy="170" r="7"/><circle cx="370" cy="170" r="7"/><circle cx="565" cy="170" r="7"/><circle cx="635" cy="170" r="8"/><circle cx="670" cy="170" r="9"/></g><text x="50" y="205" class="s">граница</text><text x="330" y="205" class="s">устойчивая область</text><text x="625" y="205" class="s">граница</text></g>
<g transform="translate(804 390)"><rect width="360" height="238" rx="8" class="bad"/><text x="18" y="34" class="p">D. Режим отказа</text><text x="20" y="75" class="s">Экстраполяция за диапазон</text><path d="M35 175H315" stroke="#aebfc9"/><path d="M45 160 C110 135 170 125 220 85 S285 28 320 18" fill="none" stroke="#a94f4f" stroke-width="4"/><path d="M240 55V190" stroke="#a94f4f" stroke-dasharray="6 5"/><text x="245" y="210" class="s">нет гарантии</text></g>
</svg>
