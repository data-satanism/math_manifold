<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Разделение ошибки по масштабам</title><desc id="d">Сглаживание удаляет осциллирующую ошибку, грубая сетка исправляет гладкую.</desc><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#18324b}.h{font-size:25px;font-weight:700}.l{font-size:17px}.b{fill:none;stroke:#183f72;stroke-width:3}.a{fill:none;stroke:#e27832;stroke-width:3}.g{stroke:#9eb3c7;stroke-width:2}.box{fill:#edf3f7;stroke:#7591aa;stroke-width:2}</style>
<text x="40" y="45" class="h">Многосеточный цикл разделяет ошибку по масштабу</text><text x="55" y="90" class="l">до сглаживания</text><path d="M55 155 Q95 55 135 155 T215 155 T295 155 T375 155 T455 155" class="b"/><path d="M55 155 Q255 55 455 155" class="a"/><text x="55" y="225" class="l">после сглаживания: остаётся гладкая компонента</text><path d="M55 290 Q255 190 455 290" class="a"/>
<text x="585" y="90" class="l">V-цикл</text><circle cx="600" cy="135" r="8" fill="#183f72"/><circle cx="780" cy="235" r="8" fill="#183f72"/><circle cx="600" cy="335" r="8" fill="#183f72"/><path d="M610 140 L770 230 L610 330" class="b"/><path d="M600 335 L430 435 L600 435 L780 335" class="a"/><text x="625" y="160" class="l">огрубление</text><text x="625" y="315" class="l">уточнение и коррекция</text><rect x="55" y="390" width="340" height="70" rx="10" class="box"/><text x="80" y="430" class="l">сглаживание убирает быстрый режим</text><rect x="585" y="390" width="340" height="70" rx="10" class="box"/><text x="610" y="430" class="l">грубая сетка убирает медленный режим</text><text x="310" y="495" class="l">‖I-BA‖ₐ ≤ γ &lt; 1</text>
</svg>

