<title id="t">Слабая форма и проекция Галёркина</title><desc id="d">Точное решение, кусочно-линейная аппроксимация и предупреждение о неустойчивости.</desc>
<rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#18324b}.h{font-size:25px;font-weight:700}.l{font-size:17px}.s{font-size:14px}.b{fill:none;stroke:#183f72;stroke-width:3}.a{fill:none;stroke:#e27832;stroke-width:3;stroke-dasharray:8 6}.g{stroke:#aebdca;stroke-width:1}.w{fill:#fff4ef;stroke:#c94b38;stroke-width:2}</style>
