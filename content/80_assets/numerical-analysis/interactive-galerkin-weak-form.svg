<text x="90" y="90" class="l">точное решение</text><text x="610" y="115" class="l" fill="#e27832">проекция на локальный базис</text><rect x="70" y="350" width="400" height="95" rx="10" fill="#eaf1f7" stroke="#7591aa"/><text x="95" y="385" class="l">Невязка ортогональна тестовому пространству</text><text x="95" y="420" class="l">‖u-uₙ‖ ≤ C inf ‖u-v‖</text><rect x="530" y="350" width="400" height="95" rx="10" class="w"/><text x="555" y="385" class="l">Если устойчивость исчезает,</text><text x="555" y="420" class="l">уточнение сетки может усиливать ошибку.</text><text x="70" y="485" class="s">Статическая версия интерактива: меняются число элементов и константа устойчивости.</text>
