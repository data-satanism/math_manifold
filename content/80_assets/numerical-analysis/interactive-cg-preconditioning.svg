<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Метод сопряжённых градиентов и предобусловливание</title><desc id="d">Чебышёвская огибающая зависит от спектрального интервала, числа Ритца обнаруживают крайние направления, а предобусловливание собирает спектр.</desc><defs><style>.p{fill:#fff;stroke:#c8d6e2;stroke-width:1.5}.i{fill:none;stroke:#17324d;stroke-width:2}.m{fill:none;stroke:#6e879b;stroke-width:1.5}.a{fill:none;stroke:#e66b19;stroke-width:3}.dot{fill:#17324d}.hot{fill:#e66b19}.ttl{fill:#17324d;font:700 24px system-ui,sans-serif}.txt{fill:#17324d;font:16px system-ui,sans-serif}.s{fill:#6e879b;font:14px system-ui,sans-serif}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="#e66b19"/></marker></defs><rect width="1000" height="560" fill="#fff"/><rect class="p" x="20" y="20" width="300" height="520" rx="10"/><rect class="p" x="350" y="20" width="300" height="520" rx="10"/><rect class="p" x="680" y="20" width="300" height="520" rx="10"/><text class="ttl" x="42" y="58">А. Энергия</text><g transform="translate(165 280) rotate(-25)"><ellipse class="m" rx="125" ry="42"/><ellipse class="m" rx="95" ry="32"/><ellipse class="m" rx="65" ry="22"/><ellipse class="m" rx="35" ry="12"/></g><path class="i" d="M75 150L125 245L195 205L225 285L175 300"/><circle class="hot" cx="175" cy="300" r="7"/><text class="s" x="55" y="500">лучшая точка в подпространстве</text><text class="ttl" x="372" y="58">Б. Числа Ритца</text><path class="i" d="M380 150H620"/><circle class="hot" cx="395" cy="150" r="7"/><circle class="dot" cx="440" cy="150" r="4"/><circle class="dot" cx="480" cy="150" r="4"/><circle class="dot" cx="520" cy="150" r="4"/><circle class="hot" cx="605" cy="150" r="7"/><path class="m" d="M385 450H620V230"/><path class="i" d="M390 260C445 275 480 315 510 340"/><path class="a" marker-end="url(#a)" d="M510 340C545 385 580 430 620 445"/><text class="s" x="385" y="195">крайние направления обнаружены</text><text class="txt" x="400" y="500">ошибка ускоряется</text><text class="ttl" x="702" y="58">В. Предобусловливание</text><path class="i" d="M710 145H950"/><g fill="#17324d"><circle cx="720" cy="145" r="4"/><circle cx="745" cy="145" r="4"/><circle cx="780" cy="145" r="4"/><circle cx="850" cy="145" r="4"/><circle cx="935" cy="145" r="4"/></g><path class="a" marker-end="url(#a)" d="M825 180V245"/><path class="i" d="M710 300H950"/><g fill="#e66b19"><circle cx="805" cy="300" r="4"/><circle cx="820" cy="300" r="4"/><circle cx="835" cy="300" r="4"/><circle cx="850" cy="300" r="4"/><circle cx="865" cy="300" r="4"/></g><text class="s" x="735" y="350">спектр собран в кластер</text><path class="i" d="M720 480C750 390 800 500 850 410"/><path class="a" marker-end="url(#a)" d="M875 475L930 405"/><text class="s" x="735" y="520">короче траектория</text></svg>
