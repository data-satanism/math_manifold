<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Геометрия поиска шага</title><desc id="d">Длинный шаг пересекает узкую долину, дробление обеспечивает убывание, а масштабирование сокращает траекторию.</desc><defs><style>.p{fill:#fff;stroke:#c8d6e2;stroke-width:1.5}.l{fill:none;stroke:#c8d6e2;stroke-width:1.5}.i{fill:none;stroke:#17324d;stroke-width:2}.a{fill:none;stroke:#e66b19;stroke-width:3}.dot{fill:#e66b19}.ttl{fill:#17324d;font:700 25px system-ui,sans-serif}.txt{fill:#17324d;font:17px system-ui,sans-serif}.s{fill:#6e879b;font:15px system-ui,sans-serif}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="#e66b19"/></marker></defs><rect width="1000" height="560" fill="#fff"/><rect class="p" x="20" y="20" width="465" height="520" rx="10"/><rect class="p" x="515" y="20" width="465" height="250" rx="10"/><rect class="p" x="515" y="290" width="465" height="250" rx="10"/><text class="ttl" x="45" y="58">А. Узкая долина</text><g transform="translate(255 285) rotate(-28)"><ellipse class="l" rx="195" ry="55"/><ellipse class="l" rx="160" ry="44"/><ellipse class="l" rx="125" ry="34"/><ellipse class="l" rx="90" ry="24"/><ellipse class="l" rx="55" ry="14"/></g><path class="a" marker-end="url(#a)" d="M92 135L180 360L260 205L315 330L365 265L410 295"/><text class="s" x="60" y="505">градиент зигзагом исправляет разные масштабы</text><text class="ttl" x="540" y="58">Б. Дробление шага</text><ellipse class="l" cx="745" cy="145" rx="190" ry="42"/><path class="a" marker-end="url(#a)" d="M565 145H935"/><text class="s" x="555" y="205">слишком длинный</text><path class="a" marker-end="url(#a)" d="M565 220H735"/><text class="s" x="760" y="225">принят после уменьшения</text><text class="ttl" x="540" y="328">В. Новые координаты</text><g transform="translate(650 420) rotate(-28)"><ellipse class="l" rx="110" ry="35"/><ellipse class="l" rx="80" ry=