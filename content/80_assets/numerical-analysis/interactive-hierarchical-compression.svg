<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Иерархическое блочно-малоранговое сжатие</title><desc id="d">Ближние блоки подробны, дальние заменяются малоранговыми факторами; контролируются остаток и память.</desc><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#18324b}.h{font-size:25px;font-weight:700}.l{font-size:17px}.s{font-size:14px}.near{fill:#315f8a}.far{fill:#c6d9e7;stroke:#7591aa}.acc{fill:none;stroke:#e27832;stroke-width:3}.box{fill:#edf3f7;stroke:#7591aa;stroke-width:2}</style><text x="40" y="45" class="h">Иерархия: локально подробно, далеко — малый ранг</text>
<g transform="translate(70 90)"><rect width="310" height="310" fill="#edf3f7" stroke="#456b8a"/><rect width="95" height="95" class="near"/><rect x="105" y="105" width="95" height="95" class="near"/><rect x="210" y="210" width="100" height="100" class="near"/><rect x="105" width="205" height="95" class="far"/><rect y="105" width="95" height="205" class="far"/><rect x="210" y="105" width="100" height="95" class="far"/><rect x="105" y="210" width="95" height="100" class="far"/><rect x="102" y="-3" width="211" height="101" class="acc"/></g><text x="80" y="430" class="l">ближние блоки: полный ранг</text><text x="80" y="458" class="l">дальние блоки: U Vᵀ</text>
<g transform="translate(520 95)"><rect width="390" height="120" rx="12" class="box"/><text x="25" y="38" class="l">ранг r ↑  → остаток ↓, память ↑</text><text x="25" y="78" class="l">проверка: ‖A-Ã‖ / ‖A‖ ≤ ε</text><rect x="25" y="92" width="300" height="12" fill="#d8e5ed"/><rect x="25" y="92" width="180" height="12" fill="#e27832"/></g><g transform="translate(520 260)"><rect width="390" height="140" rx="12" fill="#fff4ef" stroke="#c94b38" stroke-width="2"/><text x="25" y="38" class="l">Режим отказа</text><text x="25" y="72" class="l">медленный спад сингулярных чисел</text><text x="25" y="104" class="l">⇒ малый ранг не даёт точности</text></g><text x="520" y="455" class="s">Интерактив меняет допустимый ранг, ближнюю зону и структуру дальних блоков.</text>
</svg>

