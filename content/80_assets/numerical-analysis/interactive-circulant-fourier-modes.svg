<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d">
<title id="t">Частотная диагонализация циркулянта</title><desc id="d">Сигнал преобразуется в независимые частотные каналы и возвращается обратным преобразованием.</desc><rect width="1000" height="520" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#18324b}.h{font-size:25px;font-weight:700}.l{font-size:17px}.b{fill:none;stroke:#183f72;stroke-width:3}.a{fill:#e27832}.box{fill:#edf3f7;stroke:#7591aa;stroke-width:2}.arr{stroke:#456b8a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#456b8a"/></marker></defs>
<text x="40" y="45" class="h">Циркулянт раскрывается в частотном базисе</text><rect x="55" y="110" width="190" height="180" rx="12" class="box"/><path d="M75 205 Q95 105 115 205 T155 205 T195 205 T235 205" class="b"/><text x="105" y="270" class="l">сигнал</text><line x1="255" y1="200" x2="350" y2="200" class="arr"/><text x="270" y="180" class="l">БПФ</text><g class="a"><rect x="380" y="130" width="25" height="120"/><rect x="420" y="165" width="25" height="85"/><rect x="460" y="205" width="25" height="45"/><rect x="500" y="185" width="25" height="65"/></g><text x="375" y="290" class="l">частотные множители</text><line x1="545" y1="200" x2="640" y2="200" class="arr"/><text x="560" y="180" class="l">обратное БПФ</text><rect x="660" y="110" width="270" height="180" rx="12" class="box"/><path d="M680 205 Q700 75 720 205 T760 205 T800 205 T840 205 T880 205 T920 205" fill="none" stroke="#e27832" stroke-width="3"/><text x="735" y="270" class="l">отфильтрованный сигнал</text><rect x="90" y="350" width="820" height="90" rx="10" fill="#fff4ef" stroke="#c94b38" stroke-width="2"/><text x="125" y="388" class="l">Непериодическая граница создаёт искусственный скачок при циклической обёртке.</text><text x="260" y="420" class="l">C = F* diag(Fc) F / n, стоимость O(n log n)</text>
</svg>
