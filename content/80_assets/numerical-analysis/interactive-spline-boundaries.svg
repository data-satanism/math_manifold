<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Граничные условия и локальность кубического сплайна</title><desc id="d">Статическая схема естественного сплайна, трёхдиагональной связи и калибровки.</desc><defs><style>.h{font:700 28px system-ui;fill:#263746}.p{font:600 19px system-ui;fill:#263746}.s{font:16px system-ui;fill:#5f7482}.box{fill:#f4f7f9;stroke:#aebfc9;stroke-width:1.5}.curve{fill:none;stroke:#66869b;stroke-width:4}.accent{fill:none;stroke:#d27a37;stroke-width:4}.bad{fill:#fff4f2;stroke:#a94f4f;stroke-width:2}</style></defs><rect width="1200" height="680" fill="white"/><text x="36" y="48" class="h">Сплайн соединяет локальную гибкость с глобальной гладкостью</text>
<g transform="translate(36 82)"><rect width="550" height="245" rx="8" class="box"/><text x="18" y="32" class="p">A. Естественный кубический сплайн</text><path d="M30 190 C95 175 115 62 180 110 S285 210 350 92 S455 80 520 165" class="curve"/><g fill="#263746"><circle cx="30" cy="190" r="5"/><circle cx="130" cy="82" r="5"/><circle cx="240" cy="155" r="5"/><circle cx="350" cy="92" r="5"/><circle cx="445" cy="105" r="5"/><circle cx="520" cy="165" r="5"/></g><text x="25" y="225" class="s">S″(a)=S″(b)=0; минимальна энергия изгиба</text></g>
<g transform="translate(614 82)"><rect width="550" height="245" rx="8" class="box"/><text x="18" y="32" class="p">B. Аналогия: упругая линейка</text><path d="M35 180 C110 170 125 70 200 115 S325 190 390 95 S485 90 520 145" class="accent"/><g fill="#d27a37"><rect x="29" y="170" width="12" height="25"/><rect x="194" y="104" width="12" height="25"/><rect x="384" y="84" width="12" height="25"/><rect x="514" y="134" width="12" height="25"/></g><text x="25" y="225" class="s">Точки фиксированы, частые резкие изгибы дороги</text></g>
<g transform="translate(36 390)"><rect width="740" height="238" rx="8" class="box"/><text x="18" y="34" class="p">C. Перенос: гладкий калибратор вероятности</text><path d="M55 185 C145 180 190 160 265 135 S420 80 680 55" class="curve"/><path d="M55 185 C160 178 215 162 285 125 S435 70 680 40" class="accent"/><g fill="#263746"><circle cx="130" cy="172" r="5"/><circle cx="265" cy="135" r="5"/><circle cx="420" cy="86" r="5"/><circle cx="620" cy="58" r="5"/></g><text x="45" y="215" class="s">штраф кривизны защищает от подгонки шума</text></g>
<g transform="translate(804 390)"><rect width="360" height="238" rx="8" class="bad"/><text x="18" y="34" class="p">D. Режим отказа</text><path d="M35 180 C100 160 140 55 205 130 S280 220 325 80" fill="none" stroke="#a94f4f" stroke-width="4"/><path d="M35 190L325 45" stroke="#aebfc9" stroke-dasharray="6 5"/><text x="20" y="218" class="s">монотонные данные ≠ монотонный сплайн</text></g></svg>
