<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Альтернанс минимаксного приближения</title><desc id="d">Статическая схема чередующихся экстремумов, робастного переноса и режима отказа.</desc><defs><style>.h{font:700 28px system-ui;fill:#263746}.p{font:600 19px system-ui;fill:#263746}.s{font:16px system-ui;fill:#5f7482}.box{fill:#f4f7f9;stroke:#aebfc9;stroke-width:1.5}.curve{fill:none;stroke:#66869b;stroke-width:4}.accent{stroke:#d27a37;fill:none;stroke-width:2}.bad{fill:#fff4f2;stroke:#a94f4f;stroke-width:2}</style></defs><rect width="1200" height="680" fill="white"/><text x="36" y="48" class="h">Альтернанс превращает глобальный оптимум в видимый сертификат</text>
<g transform="translate(36 82)"><rect width="550" height="245" rx="8" class="box"/><text x="18" y="32" class="p">A. Равные чередующиеся пики</text><path d="M30 75H520M30 190H520" class="accent" stroke-dasharray="7 5"/><path d="M30 75 C80 75 85 190 135 190 S190 75 245 75 S300 190 355 190 S410 75 465 75 S505 190 520 190" class="curve"/><g fill="#263746"><circle cx="30" cy="75" r="6"/><circle cx="135" cy="190" r="6"/><circle cx="245" cy="75" r="6"/><circle cx="355" cy="190" r="6"/><circle cx="465" cy="75" r="6"/><circle cx="520" cy="190" r="6"/></g><text x="25" y="225" class="s">n+2 активных точки для степени n</text></g>
<g transform="translate(614 82)"><rect width="550" height="245" rx="8" class="box"/><text x="18" y="32" class="p">B. Аналогия: натянутая полоса ошибки</text><path d="M50 65H500M50 195H500" stroke="#d27a37" stroke-width="5"/><path d="M90 65V195M190 65V195M290 65V195M390 65V195M490 65V195" stroke="#66869b" stroke-width="3"/><text x="35" y="225" class="s">Ослабление одного упора усиливает другой</text></g>
<g transform="translate(36 390)"><rect width="740" height="238" rx="8" class="box"/><text x="18" y="34" class="p">C. Перенос: баланс худших ошибок по группам</text><path d="M65 180H680" stroke="#aebfc9"/><g fill="#66869b"><rect x="90" y="90" width="70" height="90"/><rect x="230" y="88" width="70" height="92"/><rect x="370" y="92" width="70" height="88"/><rect x="510" y="89" width="70" height="91"/></g><path d="M60 82H610" stroke="#d27a37" stroke-dasharray="8 6" stroke-width="3"/><text x="82" y="210" class="s">группа A</text><text x="222" y="210" class="s">группа B</text><text x="362" y="210" class="s">группа C</text><text x="502" y="210" class="s">группа D</text></g>
<g transform="translate(804 390)"><rect width="360" height="238" rx="8" class="bad"/><text x="18" y="34" class="p">D. Режим отказа</text><g fill="#a94f4f"><rect x="50" y="130" width="55" height="55"/><rect x="135" y="115" width="55" height="70"/><rect x="220" y="35" width="55" height="150"/></g><text x="25" y="218" class="s">выброс диктует весь минимаксный оптимум</text></g></svg>
