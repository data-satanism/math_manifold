<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Геометрия минимальной невязки</title><desc id="d">Начальная невязка раскладывается на проекцию и перпендикулярный минимальный остаток; ненормальность ограничивает чисто спектральный прогноз.</desc><defs><style>.p{fill:#fff;stroke:#c8d6e2;stroke-width:1.5}.i{fill:none;stroke:#17324d;stroke-width:2}.m{fill:none;stroke:#6e879b;stroke-width:1.5;stroke-dasharray:6 5}.a{fill:none;stroke:#e66b19;stroke-width:3}.ttl{fill:#17324d;font:700 25px system-ui,sans-serif}.txt{fill:#17324d;font:17px system-ui,sans-serif}.s{fill:#6e879b;font:15px system-ui,sans-serif}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="#e66b19"/></marker></defs><rect width="1000" height="560" fill="#fff"/><rect class="p" x="20" y="20" width="600" height="520" rx="10"/><rect class="p" x="650" y="20" width="330" height="520" rx="10"/><text class="ttl" x="45" y="58">А. Ортогональная проекция</text><path d="M70 440L575 315L600 430L95 520z" fill="#edf3f7" stroke="#c8d6e2"/><path class="i" d="M110 455L390 110"/><path class="m" d="M390 110L440 405"/><path class="a" marker-end="url(#a)" d="M440 405L390 110"/><path class="i" d="M110 455L440 405"/><text class="txt" x="390" y="95">начальная невязка</text><text class="s" x="300" y="490">образ подпространства</text><text class="txt" x="450" y="250">минимальный остаток</text><text class="ttl" x="675" y="58">Б. Ненормальность</text><path class="i" d="M690 170H950M820 80V260"/><circle cx="820" cy="170" r="7" fill="#17324d"/><ellipse cx="820" cy="170" rx="55" ry="45" fill="none" stroke="#6e879b"/><ellipse cx="820" cy="360" rx="115" ry="65" fill="#edf3f7" stroke="#6e879b"/><path class="a" marker-end="url(#a)" d="M730 390C760 310 835 420 925 330"/><text class="s" x="700" y="285">один спектр</text><text class="txt" x="700" y="470">разные траектории невязки</text><text class="s" x="735" y="510">спектра недостаточно</text></svg>

