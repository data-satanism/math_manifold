<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Квадратура Гаусса и оценка ожиданий</title><desc id="d">Статическая схема ортогональных узлов, моментов, вероятностного переноса и ограничения метода.</desc><defs><style>.h{font:700 28px system-ui;fill:#263746}.p{font:600 19px system-ui;fill:#263746}.s{font:16px system-ui;fill:#5f7482}.box{fill:#f4f7f9;stroke:#aebfc9;stroke-width:1.5}.curve{fill:none;stroke:#66869b;stroke-width:4}.accent{fill:#d27a37}.bad{fill:#fff4f2;stroke:#a94f4f;stroke-width:2}</style></defs><rect width="1200" height="680" fill="white"/><text x="36" y="48" class="h">Квадратура Гаусса выбирает узлы, сохраняющие максимум моментов</text>
<g transform="translate(36 82)"><rect width="550" height="245" rx="8" class="box"/><text x="18" y="32" class="p">A. Корни ортогонального многочлена</text><path d="M30 180 C105 80 185 55 275 55 S445 80 520 180" class="curve"/><path d="M30 180H520" stroke="#aebfc9"/><g class="accent"><circle cx="95" cy="180" r="9"/><circle cx="215" cy="180" r="12"/><circle cx="335" cy="180" r="12"/><circle cx="455" cy="180" r="9"/></g><text x="25" y="225" class="s">Размер точки кодирует квадратурный вес</text></g>
<g transform="translate(614 82)"><rect width="550" height="245" rx="8" class="box"/><text x="18" y="32" class="p">B. Точность по моментам</text><text x="35" y="85" class="h">n узлов</text><path d="M185 78H310" stroke="#66869b" stroke-width="3"/><path d="M300 70L315 78L300 86" fill="#66869b"/><text x="330" y="85" class="h">до 2n−1</text><text x="35" y="140" class="s">Точно для 1, x, x², …, x²ⁿ⁻¹</text><text x="35" y="190" class="s">Степень 2n уже невозможна в общем случае</text></g>
<g transform="translate(36 390)"><rect width="740" height="238" rx="8" class="box"/><text x="18" y="34" class="p">C. Перенос: ожидание дорогой модели</text><path d="M60 175 C145 70 260 60 350 150 S565 180 680 55" class="curve"/><g class="accent"><circle cx="120" cy="112" r="8"/><circle cx="280" cy="91" r="12"/><circle cx="470" cy="174" r="12"/><circle cx="625" cy="91" r="8"/></g><text x="45" y="215" class="s">несколько взвешенных сценариев заменяют плотный перебор</text></g>
<g transform="translate(804 390)"><rect width="360" height="238" rx="8" class="bad"/><text x="18" y="34" class="p">D. Режим отказа</text><path d="M30 180H325" stroke="#aebfc9"/><path d="M45 180 L240 180 L255 35 L270 180 L325 180" fill="none" stroke="#a94f4f" stroke-width="4"/><g fill="#66869b"><circle cx="95" cy="180" r="6"/><circle cx="175" cy="180" r="6"/><circle cx="305" cy="180" r="6"/></g><text x="25" y="218" class="s">узкий пик оказался между всеми узлами</text></g></svg>
