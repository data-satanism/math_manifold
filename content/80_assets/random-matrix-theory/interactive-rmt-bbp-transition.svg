<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Спайковый переход выборочной ковариации</title>
  <desc id="desc">Статическая схема скрытого и отделившегося спайка с согласованием собственного вектора.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="55" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#20313d">Спайковый переход: порог видимости сигнала</text>
  <rect x="55" y="105" width="520" height="390" rx="14" fill="#f8fafb" stroke="#aebdc7"/>
  <text x="85" y="145" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20313d">Ниже порога ℓ ≤ √c</text>
  <line x1="95" y1="390" x2="535" y2="390" stroke="#20313d" stroke-width="3"/>
  <path d="M150 390 C190 185, 325 185, 455 390 Z" fill="#b9cbd8" stroke="#406580" stroke-width="5"/>
  <circle cx="445" cy="390" r="11" fill="#d9772f"/>
  <text x="100" y="450" font-family="Arial,sans-serif" font-size="22" fill="#52616b">сигнал сливается с шумовым краем</text>
  <rect x="625" y="105" width="520" height="390" rx="14" fill="#f8fafb" stroke="#aebdc7"/>
  <text x="655" y="145" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#20313d">Выше порога ℓ &gt; √c</text>
  <line x1="665" y1="390" x2="1105" y2="390" stroke="#20313d" stroke-width="3"/>
  <path d="M715 390 C755 185, 885 185, 985 390 Z" fill="#b9cbd8" stroke="#406580" stroke-width="5"/>
  <circle cx="1070" cy="390" r="13" fill="#d9772f"/>
  <line x1="985" y1="175" x2="985" y2="420" stroke="#d9772f" stroke-width="4" stroke-dasharray="11 8"/>
  <text x="1025" y="350" font-family="Arial,sans-serif" font-size="22" fill="#d9772f">выброс</text>
  <text x="655" y="450" font-family="Arial,sans-serif" font-size="22" fill="#52616b">возникает устойчивое согласование направления</text>
  <rect x="55" y="525" width="1090" height="58" rx="10" fill="#fff5ec" stroke="#d9772f"/>
  <text x="80" y="562" font-family="Arial,sans-serif" font-size="22" fill="#8f4517">Граница: спектральный выброс не доказывает семантическую значимость направления.</text>
</svg>
