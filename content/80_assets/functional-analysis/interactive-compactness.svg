<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Компактность</title><desc>Открытое покрытие и сходящаяся подпоследовательность</desc><rect width="1200" height="700" fill="white"/><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#2563eb" stroke-width="1"/></marker></defs><text x="64" y="66" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#334155">Компактность</text><text x="64" y="101" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#64748b">Открытое покрытие и сходящаяся подпоследовательность</text><line x1="64" y1="124" x2="1136" y2="124" stroke="#64748b"/><rect x="64" y="160" width="512" height="460" fill="#f8fafc" stroke="#64748b"/><rect x="624" y="160" width="512" height="460" fill="#f8fafc" stroke="#64748b"/><text x="88" y="198" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155">(а) геометрическая схема</text><text x="648" y="198" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#334155">(б) наблюдаемая величина</text><g stroke="#64748b" stroke-width="2"><line x1="112" y1="548" x2="530" y2="548"/><line x1="152" y1="578" x2="152" y2="242"/><line x1="672" y1="548" x2="1090" y2="548"/><line x1="712" y1="578" x2="712" y2="242"/></g><ellipse cx='310' cy='402' rx='150' ry='100' fill='none' stroke='#2563eb' stroke-width='4'/><circle cx='230' cy='370' r='6' fill='#2563eb'/><circle cx='300' cy='430' r='6' fill='#2563eb'/><circle cx='382' cy='384' r='6' fill='#2563eb'/><text x="764" y="510" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#334155">K компактно</text><text x="64" y="660" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b">Статический fallback: смысловые объекты остаются видимыми без скрипта.</text> <g stroke="#2563eb" stroke-width="2" fill="none"><line x1="430" y1="570" x2="510" y2="570" marker-end="url(#arr)"/><line x1="990" y1="570" x2="1070" y2="570" marker-end="url(#arr)"/></g></svg>