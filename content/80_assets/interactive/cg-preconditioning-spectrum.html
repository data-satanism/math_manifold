<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сопряжённые градиенты и предобусловливание</title><style>:root{--ink:#17324d;--muted:#6e879b;--line:#c8d6e2;--accent:#e66b19;--wash:#edf3f7}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 system-ui,sans-serif}.app{max-width:980px;margin:auto;padding:16px}.controls{display:flex;gap:18px;flex-wrap:wrap}.control{flex:1;min-width:220px}label{display:block;font-weight:650}input{width:100%}output{color:var(--accent)}canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px}.note{margin-top:10px;padding:10px 12px;background:var(--wash);border-left:3px solid var(--accent)}</style></head><body><main class="app"><div class="controls"><div class="control"><label for="kappa">Число обусловленности до: <output id="ko">100</output></label><input id="kappa" type="range" min="4" max="400" value="100"></div><div class="control"><label for="quality">Сила предобусловливателя: <output id="qo">0.70</output></label><input id="quality" type="range" min="0" max="0.95" step="0.05" value="0.7"></div><div class="control"><label for="steps">Итерация: <output id="so">10</output></label><input id="steps" type="range" min="1" max="40" value="10"></div></div><canvas id="plot" width="940" height="500" role="img" aria-label="Спектр до и после предобусловливания и оценки ошибки сопряжённых градиентов"></canvas><div class="note" id="summary" aria-live="polite"></div></main><script>const c=plot,g=c.getContext('2d'),ink='#17324d',muted='#6e879b',line='#c8d6e2',accent='#e66b19';function bound(K,k){return Math.min(1,2*Math.pow((Math.sqrt(K)-1)/(Math.sqrt(K)+1),k))}function draw(){let K=+kappa.value,q=+quality.value,k=+steps.value,K2=1+(K-1)*(1-q);ko.value=K;qo.value=q.toFixed(2);so.value=k;g.clearRect(0,0,c.width,c.height);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle=ink;g.font='16px system-ui';g.fillText('Спектр до преобразования',45,42);g.fillText('Спектр после преобразования',45,185);g.fillText('Огибающая энергетической ошибки',480,42);function spectrum(y,kk,col){g.strokeStyle=ink;g.beginPath();g.moveTo(55,y);g.lineTo(420,y);g.stroke();for(let i=0;i<22;i++){let t=i/21,x=55+365*Math.log(1+t*(kk-1))/Math.log(kk);g.fillStyle=i===0||i===21?accent:col;g.beginPath();g.arc(x,y,4,0,7);g.fill()}}spectrum(100,K,muted);spectrum(245,K2,ink);g.strokeStyle=line;g.strokeRect(500,70,390,330);g.beginPath();for(let i=0;i<=40;i++){let x=500+i/40*390,y=390-bound(K,i)*290;i?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle=muted;g.lineWidth=2;g.stroke();g.beginPath();for(let i=0;i<=40;i++){let x=500+i/40*390,y=390-bound(K2,i)*290;i?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle=accent;g.lineWidth=2.5;g.stroke();let x=500+k/40*390;g.strokeStyle=ink;g.setLineDash([5,5]);g.beginPath();g.moveTo(x,70);g.lineTo(x,400);g.stroke();g.setLineDash([]);g.fillStyle=muted;g.fillText('до',780,90);g.fillStyle=accent;g.fillText('после',820,120);summary.textContent=`После преобразования модельное число обусловленности: ${K2.toFixed(1)}. Классическая граница ошибки на шаге ${k}: до ${bound(K,k).toExponential(2)}, после ${bound(K2,k).toExponential(2)}. Реальная сходимость может быть быстрее из-за кластеров.`}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',draw));draw();</script></body></html>
