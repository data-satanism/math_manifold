<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Квадратура Гаусса</title>
<style>:root{--ink:#263746;--muted:#6f8391;--grid:#dbe4e9;--blue:#66869b;--accent:#d27a37;--bad:#a94f4f;--fill:#e9f0f4}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:980px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}h1{font-size:1.35rem;margin:0}.sub{margin:4px 0 0;color:var(--muted)}.controls{display:flex;gap:14px;flex-wrap:wrap}label{display:grid;gap:4px;color:var(--muted);font-size:.86rem}input{font:inherit;accent-color:var(--accent)}canvas{width:100%;height:auto;border:1px solid var(--grid);border-radius:8px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{background:var(--fill);padding:10px 12px;border-radius:7px}.stat b{display:block}.insight{border-left:3px solid var(--accent);padding:8px 12px;margin-top:14px;background:#fffaf6}@media(max-width:700px){main{padding:12px}.stats{grid-template-columns:1fr 1fr}.controls{width:100%}label{flex:1}}@media(max-width:430px){.stats{grid-template-columns:1fr}}</style></head>
<body><main><div class="head"><div><h1>Квадратура Гаусса: n значений воспроизводят 2n моментов</h1><p class="sub">Проверьте границу алгебраической точности на мономах.</p></div><div class="controls"><label>Число узлов: <span id="nOut">4</span><input id="nodes" type="range" min="2" max="8" value="4" step="1"></label><label>Степень монома: <span id="mOut">7</span><input id="power" type="range" min="0" max="9" value="7" step="1"></label></div></div>
<canvas id="plot" width="920" height="470" role="img" aria-label="График монома, гауссовы узлы и веса квадратуры"></canvas>
<div class="stats"><div class="stat"><span>Точная степень до</span><b id="limit">—</b></div><div class="stat"><span>Точный интеграл</span><b id="exact">—</b></div><div class="stat"><span>Квадратура</span><b id="approx">—</b></div><div class="stat"><span>Ошибка</span><b id="error">—</b></div></div>
<p class="insight" id="insight">Корни ортогонального многочлена размещают узлы так, чтобы одновременно воспроизвести максимально возможное число моментов.</p>
<noscript><img src="../../numerical-analysis/interactive-gauss-quadrature.svg" alt="Статическая схема точности квадратуры Гаусса" style="max-width:100%"></noscript>
</main><script>
const C=document.getElementById('plot'),ctx=C.getContext('2d'),nodes=document.getElementById('nodes'),power=document.getElementById('power');
function legendre(n,x){let p0=1,p1=x;if(n===0)return[p0,0];if(n===1)return[p1,1];for(let k=2;k<=n;k++){const p=((2*k-1)*x*p1-(k-1)*p0)/k;p0=p1;p1=p}const dp=n*(x*p1-p0)/(x*x-1);return[p1,dp]}
function gauss(n){const xs=Array(n),ws=Array(n),half=Math.ceil(n/2);for(let i=0;i<half;i++){let z=Math.cos(Math.PI*(i+.75)/(n+.5));for(let it=0;it<30;it++){const[p,dp]=legendre(n,z),dz=p/dp;z-=dz;if(Math.abs(dz)<1e-15)break}const[,dp]=legendre(n,z),w=2/((1-z*z)*dp*dp);xs[i]=-z;xs[n-1-i]=z;ws[i]=ws[n-1-i]=w}return[xs,ws]}
function draw(){const n=+nodes.value,m=+power.value;power.max=2*n+1;if(m>+power.max){power.value=power.max;return draw()}const[xs,ws]=gauss(n),f=x=>Math.pow(x,m),q=xs.reduce((s,x,i)=>s+ws[i]*f(x),0),ex=m%2?0:2/(m+1),err=Math.abs(q-ex),pad={l:58,r:22,t:22,b:60},W=C.width-pad.l-pad.r,H=C.height-pad.t-pad.b,X=x=>pad.l+(x+1)/2*W,Y=y=>pad.t+(1.1-y)/2.2*H;ctx.clearRect(0,0,C.width,C.height);ctx.font='13px system-ui';ctx.fillStyle='#6f8391';ctx.strokeStyle='#dbe4e9';for(let x=-1;x<=1.001;x+=.25){ctx.beginPath();ctx.moveTo(X(x),pad.t);ctx.lineTo(X(x),pad.t+H);ctx.stroke();ctx.fillText(x.toFixed(2),X(x)-15,pad.t+H+22)}for(let y=-1;y<=1.001;y+=.5){ctx.beginPath();ctx.moveTo(pad.l,Y(y));ctx.lineTo(pad.l+W,Y(y));ctx.stroke();ctx.fillText(y.toFixed(1),12,Y(y)+4)}ctx.beginPath();for(let k=0;k<=700;k++){const x=-1+2*k/700,y=f(x);k?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.strokeStyle='#66869b';ctx.lineWidth=3;ctx.stroke();xs.forEach((x,i)=>{const y=f(x),r=5+7*ws[i]/Math.max(...ws);ctx.beginPath();ctx.moveTo(X(x),Y(0));ctx.lineTo(X(x),Y(y));ctx.strokeStyle='#d27a37';ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();ctx.arc(X(x),Y(y),r,0,2*Math.PI);ctx.fillStyle='rgba(210,122,55,.82)';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.stroke();ctx.fillStyle='#263746';ctx.fillText('ω'+(i+1),X(x)-8,pad.t+H+43)});nOut.textContent=n;mOut.textContent=m;limit.textContent=2*n-1;exact.textContent=ex.toPrecision(7);approx.textContent=q.toPrecision(7);error.textContent=err.toExponential(2);error.style.color=m<=2*n-1?'#263746':'#a94f4f';insight.textContent=m<=2*n-1?'Степень не превышает 2n−1: результат совпадает с точным интегралом с учётом ошибок округления. Узлы совместно воспроизводят нужный момент.':'Степень выше 2n−1: общая гарантия закончилась. Для чётного монома появляется заметная ошибка; случайное совпадение для нечётной функции объясняется симметрией.'}
nodes.addEventListener('input',draw);power.addEventListener('input',draw);draw();
</script></body></html>
