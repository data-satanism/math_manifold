<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Геометрия поиска шага</title>
<style>:root{--ink:#17324d;--muted:#6e879b;--line:#c8d6e2;--accent:#e66b19;--wash:#edf3f7}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 system-ui,sans-serif}.app{max-width:980px;margin:auto;padding:16px}.controls{display:flex;gap:18px;flex-wrap:wrap}.control{flex:1;min-width:220px}label{display:block;font-weight:650}input{width:100%}output{color:var(--accent)}canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px}.note{margin-top:10px;padding:10px 12px;background:var(--wash);border-left:3px solid var(--accent)}</style></head>
<body><main class="app"><div class="controls"><div class="control"><label for="kappa">Вытянутость долины: <output id="ko">20</output></label><input id="kappa" type="range" min="2" max="80" value="20"></div><div class="control"><label for="alpha">Пробный шаг: <output id="ao">0.12</output></label><input id="alpha" type="range" min="0.01" max="0.35" step="0.01" value="0.12"></div><div class="control"><label for="iters">Шаги: <output id="io">14</output></label><input id="iters" type="range" min="2" max="30" value="14"></div></div><canvas id="plot" width="940" height="500" role="img" aria-label="Линии уровня квадратичной функции и траектория градиентного метода"></canvas><div class="note" id="summary" aria-live="polite"></div></main>
<script>const c=plot,g=c.getContext('2d'),ink='#17324d',muted='#6e879b',line='#c8d6e2',accent='#e66b19';function P(x,y){let a=-.45,ca=Math.cos(a),sa=Math.sin(a),u=ca*x-sa*y,v=sa*x+ca*y;return[470+u*105,250-v*105]}function draw(){let K=+kappa.value,a=+alpha.value,n=+iters.value;ko.value=K;ao.value=a.toFixed(2);io.value=n;g.clearRect(0,0,c.width,c.height);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.strokeStyle=line;g.lineWidth=1.2;for(let j=1;j<=7;j++){g.beginPath();for(let t=0;t<=180;t++){let q=t*Math.PI/90,r=j*.32,x=r*Math.cos(q),y=r*Math.sin(q)/Math.sqrt(K);let [px,py]=P(x,y);t?g.lineTo(px,py):g.moveTo(px,py)}g.closePath();g.stroke()}let x=2.2,y=.75;let pts=[[x,y]];for(let i=0;i<n;i++){let gx=x,gy=K*y;x-=a*gx;y-=a*gy;if(Math.abs(x)+Math.abs(y)>50)break;pts.push([x,y])}g.strokeStyle=accent;g.lineWidth=2.5;g.beginPath();pts.forEach((p,i)=>{let q=P(p[0],p[1]);i?g.lineTo(...q):g.moveTo(...q)});g.stroke();pts.forEach((p,i)=>{let q=P(...p);g.fillStyle=i===pts.length-1?accent:ink;g.beginPath();g.arc(...q,4,0,7);g.fill()});g.fillStyle=ink;g.font='16px system-ui';g.fillText('узкая долина',38,42);g.fillText('минимум',482,245);let stable=a<2/K;summary.textContent=stable?`Шаг меньше порога 2/κ = ${(2/K).toFixed(3)}: траектория устойчива. Дробление шага должно уменьшить пробное значение до этой области.`:`Шаг больше порога 2/κ = ${(2/K).toFixed(3)}: крутое направление расходится. Уменьшите шаг или измените масштаб координат.`}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',draw));draw();</script></body></html>
