<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Иерархическое малоранговое сжатие</title>
<style>body{margin:0;background:#f8fafc;color:#172b4d;font:16px system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #9eb3c7;border-radius:12px;padding:16px}h1{font-size:24px}.controls{display:flex;gap:20px;flex-wrap:wrap}.controls label{display:grid;gap:5px;font-weight:650}input[type=range]{width:230px}canvas{width:100%;height:500px;border:1px solid #c8d4df;border-radius:8px;margin-top:14px}.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.tag{background:#e9f1f7;padding:7px 11px;border-radius:8px}.warn{color:#a33b2b}input:focus{outline:3px solid #e78b39}</style></head>
<body><main class="wrap"><h1>Иерархическое сжатие: ранг, остаток и память</h1><section class="panel"><div class="controls"><label>Допустимый ранг: <span id="rOut">4</span><input id="rank" type="range" min="1" max="12" value="4"></label><label>Размер ближней зоны: <span id="bOut">6</span><input id="band" type="range" min="2" max="14" value="6"></label><label><span>Структура</span><span><input id="noise" type="checkbox"> шумоподобные дальние блоки</span></label></div><canvas id="matrix" width="920" height="500" aria-label="Плотная и иерархически сжатая матрицы"></canvas><div class="stats"><span class="tag">Оценка остатка: <b id="residual"></b></span><span class="tag">Доля памяти: <b id="memory"></b></span><span class="tag warn" id="warning"></span></div></section></main>
<script>
const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d'),rank=document.getElementById('rank'),band=document.getElementById('band'),noise=document.getElementById('noise'),rOut=document.getElementById('rOut'),bOut=document.getElementById('bOut'),residual=document.getElementById('residual'),memory=document.getElementById('memory'),warning=document.getElementById('warning'),N=42;function val(i,j,noisy){const d=Math.abs(i-j);let v=Math.exp(-d/7)*(0.65+0.35*Math.cos((i+j)/6));if(noisy&&d>8)v=.5+.5*Math.sin(i*12.3+j*7.7);return Math.max(0,Math.min(1,v))}function cell(x,y,s,v){const c=Math.round(245-150*v);ctx.fillStyle=`rgb(${c},${Math.min(248,c+18)},${Math.min(252,c+35)})`;ctx.fillRect(x,y,s+.2,s+.2)}
function draw(){const r=+rank.value,b=+band.value,noisy=noise.checked;rOut.textContent=r;bOut.textContent=b;ctx.clearRect(0,0,canvas.width,canvas.height);const s=8.2,x0=45,x1=525,y0=65;ctx.fillStyle='#172b4d';ctx.font='17px system-ui';ctx.fillText('исходная плотная матрица',x0,y0-20);ctx.fillText('иерархическое представление',x1,y0-20);for(let i=0;i<N;i++)for(let j=0;j<N;j++){cell(x0+j*s,y0+i*s,s,val(i,j,noisy));let v=val(i,j,noisy);if(Math.abs(i-j)>b){const q=Math.max(2,14-r);v=Math.round(v*q)/q}cell(x1+j*s,y0+i*s,s,v)}ctx.strokeStyle='#e27832';ctx.lineWidth=2;[0,21].forEach(a=>[0,21].forEach(b0=>ctx.strokeRect(x1+b0*s,y0+a*s,21*s,21*s)));ctx.fillStyle='#172b4d';ctx.fillText('ближняя зона хранится подробно',x1,y0+N*s+28);ctx.fillStyle='#e27832';ctx.fillText('дальние блоки заменяются факторами ранга r',x1,y0+N*s+52);const decay=noisy?.72:.32,err=Math.pow(decay,r);const dense=N*N,near=N*(2*b+1),far=Math.max(0,dense-near),mem=Math.min(1,(near+2*r*N*Math.log2(N))/dense);residual.textContent=err.toExponential(2);memory.textContent=(100*mem).toFixed(0)+'%';warning.textContent=noisy?'Сингулярные числа убывают медленно: малый ранг не даёт нужной точности.':''}
rank.oninput=band.oninput=noise.onchange=draw;draw();
</script></body></html>
