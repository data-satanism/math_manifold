<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum и low-rank</title><style>
:root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--ink:#172033;--muted:#64748b}*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 system-ui;background:var(--bg);color:var(--ink)}main{max-width:920px;margin:auto;background:var(--panel);padding:24px;border-radius:20px;box-shadow:0 12px 35px #0f172a18}h1{margin-top:0;font-size:1.55rem}.controls{display:grid;grid-template-columns:1fr auto;gap:10px}input{width:100%}canvas{width:100%;height:auto;background:#fff;border-radius:16px;border:1px solid #cbd5e1;margin-top:18px}.stats{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#f8fafc;--muted:#cbd5e1}}</style></head><body><main>
<h1>Выбор малорангового усечения</h1><div class="controls"><label for="rank">ранг k: <output id="kv">4</output></label><input id="rank" type="range" min="1" max="16" value="4"><label for="noise">уровень шума: <output id="nv">0.08</output></label><input id="noise" type="range" min="0" max="0.3" step="0.01" value="0.08"></div><canvas id="c" width="840" height="470" aria-label="Сингулярные значения и порог ранга"></canvas><div class="stats"><span>Сохранённая энергия: <strong id="energy"></strong></span><span>Отброшенная энергия: <strong id="tail"></strong></span></div><noscript><img src="../../functional-analysis/interactive-spectrum.svg" alt="Спектральное усечение"></noscript></main><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),kr=document.querySelector('#rank'),nr=document.querySelector('#noise'),kv=document.querySelector('#kv'),nv=document.querySelector('#nv'),en=document.querySelector('#energy'),ta=document.querySelector('#tail');function draw(){const k=+kr.value,n=+nr.value;kv.value=k;nv.value=n.toFixed(2);const s=Array.from({length:16},(_,i)=>Math.max(.015,Math.exp(-i/3.5)+n*(.35+.65*Math.abs(Math.sin(i*2.3)))));const total=s.reduce((a,v)=>a+v*v,0),kept=s.slice(0,k).reduce((a,v)=>a+v*v,0);en.textContent=(100*kept/total).toFixed(1)+'%';ta.textContent=(100*(total-kept)/total).toFixed(1)+'%';g.clearRect(0,0,c.width,c.height);g.strokeStyle='#94a3b8';g.beginPath();g.moveTo(55,420);g.lineTo(810,420);g.stroke();s.forEach((v,i)=>{const h=330*v/s[0],x=70+i*45;g.fillStyle=i<k?'#2563eb':'#94a3b8';g.globalAlpha=i<k?.92:.45;g.fillRect(x,420-h,30,h)});g.globalAlpha=1;g.strokeStyle='#d97706';g.lineWidth=4;const x=62+k*45;g.beginPath();g.moveTo(x,70);g.lineTo(x,430);g.stroke()}[kr,nr].forEach(e=>e.addEventListener('input',draw));draw();
</script></body></html>
