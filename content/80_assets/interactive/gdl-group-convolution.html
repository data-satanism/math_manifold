<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Групповая свёртка</title><style>
:root{--blue:#3f6480;--pale:#dbe6ed;--accent:#d9772f;--ink:#20313d;--grid:#d9e1e6;--red:#bd2c2c}
*{box-sizing:border-box}body{margin:0;padding:1rem;font:16px/1.45 system-ui,sans-serif;background:#fff;color:var(--ink)}
main{max-width:1040px;margin:auto;border:1px solid #aebdc7;border-radius:14px;padding:1rem}h1{font-size:clamp(1.25rem,4vw,2rem);margin:.1rem 0 .4rem}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}.control{padding:.7rem;background:#f4f7f9;border-radius:10px}
input[type=range],select{width:100%;min-height:2.5rem;accent-color:var(--accent)}output{font-weight:700;font-variant-numeric:tabular-nums}
canvas{width:100%;height:auto;border:1px solid var(--grid);border-radius:10px;margin-top:1rem;background:#fff}.readout{margin-top:.8rem;padding:.8rem;border-left:4px solid var(--accent);background:#f4f7f9}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0}.swatch{display:inline-block;width:.9rem;height:.9rem;margin-right:.25rem;border-radius:50%}
@media(max-width:620px){body{padding:.4rem}main{padding:.65rem}}
</style></head><body><main>
<h1>Групповая свёртка</h1><p>Поворот циклического сигнала должен приводить к тому же повороту результата свёртки. Ширина ядра задаёт локальность взаимодействия.</p><div class="controls"><div class="control"><label for="shift">Сдвиг группы</label><input id="shift" type="range" min="0" max="355" step="5" value="60"><output></output></div><div class="control"><label for="kernel">Ширина ядра</label><input id="kernel" type="range" min="0.1" max="1" step="0.05" value="0.35"><output></output></div></div><canvas id="plot" width="1000" height="560" role="img" aria-label="Сдвиг сигнала и эквивариантный выход групповой свёртки"></canvas><div class="readout" id="summary" aria-live="polite"></div><noscript><img src="../../geometric-deep-learning/interactive-gdl-group-convolution.svg" alt="Статическая версия: Сдвиг сигнала и эквивариантный выход групповой свёртки"></noscript></main><script>
const C={blue:'#3f6480',pale:'#dbe6ed',accent:'#d9772f',ink:'#20313d',grid:'#d9e1e6',red:'#bd2c2c'};
function keys(el,draw){el.addEventListener('keydown',e=>{let d=(e.key==='ArrowRight'||e.key==='ArrowUp')?Number(el.step||1):(e.key==='ArrowLeft'||e.key==='ArrowDown')?-Number(el.step||1):0;if(d){e.preventDefault();el.value=String(Math.min(Number(el.max),Math.max(Number(el.min),Number(el.value)+d)));draw();}})}
function line(ctx,a,b,color=C.ink,width=2,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore()}
function dot(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
function label(ctx,t,x,y,color=C.ink,size=18){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.fillText(t,x,y)}

const shift=document.getElementById('shift'),kernel=document.getElementById('kernel'),cv=document.getElementById('plot'),x=cv.getContext('2d'),s=document.getElementById('summary');
function signal(t){return .55+.28*Math.sin(t*2)+.14*Math.cos(t*5)}function drawWave(y,off,c){x.strokeStyle=c;x.lineWidth=3;x.beginPath();for(let i=0;i<=360;i++){let t=2*Math.PI*i/360,px=80+360*i/360,py=y-90*signal(t+off);i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}
function draw(){let sh=Number(shift.value)*Math.PI/180,w=Number(kernel.value);shift.nextElementSibling.value=`${shift.value}°`;kernel.nextElementSibling.value=w.toFixed(2);x.clearRect(0,0,cv.width,cv.height);label(x,'Свёртка на циклической группе',45,42,C.blue,23);drawWave(210,0,C.blue);drawWave(450,sh,C.accent);label(x,'исходный сигнал',80,95,C.blue,18);label(x,'сдвинутый вход и согласованно сдвинутый выход',80,335,C.accent,18);let cx=720,cy=280,R=150;x.strokeStyle=C.grid;x.lineWidth=3;x.beginPath();x.arc(cx,cy,R,0,2*Math.PI);x.stroke();for(let i=0;i<16;i++){let q=2*Math.PI*i/16+sh;let v=signal(q);dot(x,cx+R*Math.cos(q),cy+R*Math.sin(q),5+8*v,i<Math.round(w*8)?C.accent:C.blue)}label(x,'ядро скользит по группе',620,500,C.ink,19);s.textContent=`Сдвиг на ${shift.value}° переставляет отсчёты, а групповая свёртка переставляет выход тем же образом. Ширина ядра ${w.toFixed(2)} задаёт локальность.`}shift.oninput=draw;kernel.oninput=draw;keys(shift,draw);keys(kernel,draw);draw();
</script></body></html>
