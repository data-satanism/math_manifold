<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Геодезическая на сфере</title><style>
:root{--blue:#3f6480;--pale:#dbe6ed;--accent:#d9772f;--ink:#20313d;--grid:#d9e1e6;--red:#bd2c2c}
*{box-sizing:border-box}body{margin:0;padding:1rem;font:16px/1.45 system-ui,sans-serif;background:#fff;color:var(--ink)}
main{max-width:1040px;margin:auto;border:1px solid #aebdc7;border-radius:14px;padding:1rem}h1{font-size:clamp(1.25rem,4vw,2rem);margin:.1rem 0 .4rem}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}.control{padding:.7rem;background:#f4f7f9;border-radius:10px}
input[type=range],select{width:100%;min-height:2.5rem;accent-color:var(--accent)}output{font-weight:700;font-variant-numeric:tabular-nums}
canvas{width:100%;height:auto;border:1px solid var(--grid);border-radius:10px;margin-top:1rem;background:#fff}.readout{margin-top:.8rem;padding:.8rem;border-left:4px solid var(--accent);background:#f4f7f9}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0}.swatch{display:inline-block;width:.9rem;height:.9rem;margin-right:.25rem;border-radius:50%}
@media(max-width:620px){body{padding:.4rem}main{padding:.65rem}}
</style></head><body><main>
<h1>Геодезическая на сфере</h1><p>Меняйте широту и угловое разделение. Сравните собственное расстояние по поверхности с евклидовой хордой.</p><div class="controls"><div class="control"><label for="latitude">Широта точек</label><input id="latitude" type="range" min="-50" max="60" step="5" value="20"><output></output></div><div class="control"><label for="separation">Разделение по долготе</label><input id="separation" type="range" min="15" max="170" step="5" value="90"><output></output></div></div><canvas id="plot" width="1000" height="560" role="img" aria-label="Геодезическая дуга и евклидова хорда на сфере"></canvas><div class="readout" id="summary" aria-live="polite"></div><noscript><img src="../../geometric-deep-learning/interactive-gdl-geodesics.svg" alt="Статическая версия: Геодезическая дуга и евклидова хорда на сфере"></noscript></main><script>
const C={blue:'#3f6480',pale:'#dbe6ed',accent:'#d9772f',ink:'#20313d',grid:'#d9e1e6',red:'#bd2c2c'};
function keys(el,draw){el.addEventListener('keydown',e=>{let d=(e.key==='ArrowRight'||e.key==='ArrowUp')?Number(el.step||1):(e.key==='ArrowLeft'||e.key==='ArrowDown')?-Number(el.step||1):0;if(d){e.preventDefault();el.value=String(Math.min(Number(el.max),Math.max(Number(el.min),Number(el.value)+d)));draw();}})}
function line(ctx,a,b,color=C.ink,width=2,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore()}
function dot(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
function label(ctx,t,x,y,color=C.ink,size=18){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.fillText(t,x,y)}

const lat=document.getElementById('latitude'),sep=document.getElementById('separation'),cv=document.getElementById('plot'),x=cv.getContext('2d'),s=document.getElementById('summary');
function draw(){let ph=Number(lat.value)*Math.PI/180,d=Number(sep.value)*Math.PI/180;lat.nextElementSibling.value=`${lat.value}°`;sep.nextElementSibling.value=`${sep.value}°`;x.clearRect(0,0,cv.width,cv.height);let cx=360,cy=285,R=210;x.fillStyle='#edf3f7';x.beginPath();x.arc(cx,cy,R,0,2*Math.PI);x.fill();x.strokeStyle=C.blue;x.lineWidth=3;x.stroke();x.strokeStyle=C.grid;for(let k=-2;k<=2;k++){x.beginPath();x.ellipse(cx,cy+k*55,R*Math.sqrt(Math.max(0,1-(k*55/R)**2)),26,0,0,2*Math.PI);x.stroke()}let p1=[cx+R*Math.cos(ph)*Math.cos(-d/2),cy-R*Math.sin(ph)],p2=[cx+R*Math.cos(ph)*Math.cos(d/2),cy-R*Math.sin(ph)];dot(x,p1[0],p1[1],10,C.accent);dot(x,p2[0],p2[1],10,C.accent);x.strokeStyle=C.accent;x.lineWidth=5;x.beginPath();x.moveTo(...p1);x.quadraticCurveTo(cx,cy-R*.92,p2[0],p2[1]);x.stroke();line(x,p1,p2,C.ink,2,[8,7]);label(x,'геодезическая по поверхности',600,170,C.accent,20);label(x,'евклидова хорда',600,240,C.ink,20);let intrinsic=Math.acos(Math.min(1,Math.max(-1,Math.sin(ph)**2+Math.cos(ph)**2*Math.cos(d))));s.textContent=`Собственное расстояние по сфере ≈ ${intrinsic.toFixed(2)} радиан. Оно учитывает геометрию многообразия; хорда систематически короче.`}lat.oninput=draw;sep.oninput=draw;keys(lat,draw);keys(sep,draw);draw();
</script></body></html>
