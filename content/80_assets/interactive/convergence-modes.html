<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Виды сходимости</title><style>
:root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--ink:#172033;--muted:#64748b;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 system-ui;background:var(--bg);color:var(--ink)}main{max-width:920px;margin:auto;background:var(--panel);padding:24px;border-radius:20px;box-shadow:0 12px 35px #0f172a18}h1{margin-top:0;font-size:1.55rem}.controls{display:grid;grid-template-columns:1fr auto;gap:12px}input{width:100%}canvas{width:100%;height:auto;background:white;border-radius:16px;border:1px solid #cbd5e1;margin-top:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{padding:12px;border-radius:12px;background:#2563eb12}.muted{color:var(--muted)}@media(max-width:640px){.cards{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#f8fafc;--muted:#cbd5e1}}</style></head><body><main>
<h1>Последовательность всплесков f<sub>n</sub>=n·1<sub>(0,1/n)</sub></h1><div class="controls"><label for="n">n: <output id="nv">8</output></label><input id="n" type="range" min="1" max="50" value="8" aria-label="Номер функции"></div>
<canvas id="c" width="840" height="460" aria-label="Всплеск функции"></canvas><div class="cards"><div class="card"><strong>Почти всюду</strong><br>f<sub>n</sub>→0</div><div class="card"><strong>L¹-норма</strong><br><span id="l1">1</span></div><div class="card"><strong>L²-норма</strong><br><span id="l2"></span></div></div><p class="muted">Поточечный предел равен нулю почти всюду, но интеграл остаётся равным 1: общей интегрируемой мажоранты нет.</p>
<noscript><img src="../../functional-analysis/interactive-convergence.svg" alt="Сужающийся и растущий всплеск"></noscript></main><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),r=document.querySelector('#n'),nv=document.querySelector('#nv'),l2=document.querySelector('#l2');function draw(){const n=+r.value;nv.value=n;l2.textContent=Math.sqrt(n).toFixed(2);g.clearRect(0,0,c.width,c.height);g.strokeStyle='#94a3b8';g.lineWidth=2;g.beginPath();g.moveTo(60,410);g.lineTo(800,410);g.moveTo(60,410);g.lineTo(60,40);g.stroke();const w=700/n,h=Math.min(330,45+285*Math.log1p(n)/Math.log(51));g.fillStyle='#2563eb33';g.strokeStyle='#2563eb';g.lineWidth=5;g.beginPath();g.moveTo(60,410);g.lineTo(60,410-h);g.lineTo(60+w,410-h);g.lineTo(60+w,410);g.closePath();g.fill();g.stroke();g.fillStyle='#172033';g.font='18px system-ui';g.fillText('ширина 1/n',75+w,400);g.fillText('высота n',75,65)}r.addEventListener('input',draw);draw();
</script></body></html>
