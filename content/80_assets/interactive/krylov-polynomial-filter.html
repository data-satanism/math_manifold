<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Полиномиальный фильтр Крылова</title><style>:root{--ink:#17324d;--muted:#6e879b;--line:#c8d6e2;--accent:#e66b19;--wash:#edf3f7}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 system-ui,sans-serif}.app{max-width:980px;margin:auto;padding:16px}.controls{display:flex;gap:18px;flex-wrap:wrap}.control{flex:1;min-width:220px}label{display:block;font-weight:650}input{width:100%}output{color:var(--accent)}canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px}.note{margin-top:10px;padding:10px 12px;background:var(--wash);border-left:3px solid var(--accent)}</style></head><body><main class="app"><div class="controls"><div class="control"><label for="degree">Степень полинома: <output id="degreeOut">5</output></label><input id="degree" type="range" min="1" max="18" value="5"></div><div class="control"><label for="cluster">Ширина полезного кластера: <output id="co">0.25</output></label><input id="cluster" type="range" min="0.08" max="0.55" step="0.01" value="0.25"></div></div><canvas id="plot" width="940" height="500" role="img" aria-label="Спектральные точки и действие полиномиального фильтра"></canvas><div class="note" id="summary" aria-live="polite"></div></main><script>const c=plot,g=c.getContext('2d'),ink='#17324d',muted='#6e879b',line='#c8d6e2',accent='#e66b19';function draw(){let k=+degree.value,w=+cluster.value;degreeOut.value=k;co.value=w.toFixed(2);g.clearRect(0,0,c.width,c.height);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.font='16px system-ui';g.fillStyle=ink;g.fillText('Спектр до фильтра',45,42);g.fillText('Модуль полинома',485,42);g.fillText('Амплитуды после фильтра',45,294);g.strokeStyle=ink;g.beginPath();g.moveTo(55,145);g.lineTo(430,145);g.moveTo(500,230);g.lineTo(900,230);g.moveTo(500,230);g.lineTo(500,65);g.moveTo(55,400);g.lineTo(430,400);g.stroke();let vals=[.08,.16,.25,.36,.48,.61,.72,.78,.84,.9,.94];let p=x=>Math.pow(Math.max(0,1-x),k);vals.forEach((x,i)=>{let useful=x>1-w;g.fillStyle=useful?accent:muted;g.beginPath();g.arc(55+x*375,145,5,0,7);g.fill();let h=125*p(x);g.fillRect(51+x*375,400-h,8,h)});g.strokeStyle=accent;g.lineWidth=2.5;g.beginPath();for(let i=0;i<=300;i++){let x=i/300,y=p(x),px=500+x*400,py=230-y*150;i?g.lineTo(px,py):g.moveTo(px,py)}g.stroke();g.strokeStyle=line;g.setLineDash([5,5]);g.strokeRect(55+(1-w)*375,105,w*375,80);g.setLineDash([]);g.fillStyle=accent;g.fillText('полезный кластер',300,95);let sup=Math.pow(w,k);summary.textContent=`На полезном кластере λ ≥ ${(1-w).toFixed(2)} выбранный модельный фильтр имеет максимум около ${sup.toExponential(2)}. Это иллюстрация: реальный крыловский метод выбирает полином по своей задаче.`}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',draw));draw();</script></body></html>
