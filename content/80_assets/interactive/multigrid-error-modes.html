<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ошибка по масштабам</title>
<style>body{margin:0;background:#f8fafc;color:#172b4d;font:16px system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #9eb3c7;border-radius:12px;padding:16px}h1{font-size:24px}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:end}.controls label{display:grid;gap:5px;font-weight:650}input{width:230px}button{padding:9px 14px;border-radius:8px;border:1px solid #365f7f;background:#e8f1f7;font-weight:700;color:#17324d}canvas{width:100%;height:430px;border:1px solid #c8d4df;border-radius:8px;margin-top:14px}.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}.tag{background:#e9f1f7;padding:7px 11px;border-radius:8px}button:focus,input:focus{outline:3px solid #e78b39;outline-offset:2px}</style></head>
<body><main class="wrap"><h1>Многосеточный цикл: кто исправляет какую ошибку?</h1><section class="panel"><div class="controls"><label>Сила сглаживания: <span id="sOut">0.65</span><input id="smooth" type="range" min="0" max="100" value="65"></label><label>Качество грубой коррекции: <span id="gOut">0.80</span><input id="coarse" type="range" min="0" max="100" value="80"></label><button id="cycle">Выполнить V-цикл</button><button id="reset">Сбросить</button></div><canvas id="plot" width="920" height="430" aria-label="Гладкая и осциллирующая компоненты ошибки"></canvas><div class="stats"><span class="tag">Энергия ошибки: <b id="energy"></b></span><span class="tag">Оценка фактора: <b id="factor"></b></span><span class="tag" id="hint"></span></div></section></main>
<script>
const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d'),smooth=document.getElementById('smooth'),coarse=document.getElementById('coarse'),sOut=document.getElementById('sOut'),gOut=document.getElementById('gOut'),cycle=document.getElementById('cycle'),reset=document.getElementById('reset'),energy=document.getElementById('energy'),factor=document.getElementById('factor'),hint=document.getElementById('hint');let low=1,high=.65,step=0;const sx=x=>55+x*(canvas.width-85),sy=(y,base)=>base-y*105;
function curve(base,a,b,color,dash,label){ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.setLineDash(dash);ctx.beginPath();for(let i=0;i<=500;i++){const x=i/500,y=a*Math.sin(2*Math.PI*x)+b*Math.sin(18*Math.PI*x);i?ctx.lineTo(sx(x),sy(y,base)):ctx.moveTo(sx(x),sy(y,base))}ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=color;ctx.font='15px system-ui';ctx.fillText(label,60,base-120)}
function draw(){const s=+smooth.value/100,g=+coarse.value/100;sOut.textContent=s.toFixed(2);gOut.textContent=g.toFixed(2);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#aebdca';[155,360].forEach(y=>{ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(890,y);ctx.stroke()});curve(155,1,.65,'#8396a8',[6,5],'ошибка до цикла');curve(360,low,high,'#183f72',[],'текущая ошибка');ctx.fillStyle='#e27832';ctx.fillText('гладкая компонента',650,28);ctx.fillStyle='#183f72';ctx.fillText('осциллирующая компонента',650,48);const e=Math.sqrt(low*low+high*high);energy.textContent=e.toFixed(3);const q=Math.max(1-g,1-s);factor.textContent=q.toFixed(2);hint.textContent=step?'Сглаживатель уменьшил быстрый режим, грубая сетка — медленный.':'Нажмите «Выполнить V-цикл».'}
cycle.onclick=()=>{high*=1-(+smooth.value/100);low*=1-(+coarse.value/100);step++;draw()};reset.onclick=()=>{low=1;high=.65;step=0;draw()};smooth.oninput=coarse.oninput=draw;draw();
</script></body></html>
