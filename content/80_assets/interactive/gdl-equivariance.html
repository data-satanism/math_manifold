<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Коммутативная диаграмма эквивариантности</title><style>
:root{--blue:#3f6480;--pale:#dbe6ed;--accent:#d9772f;--ink:#20313d;--grid:#d9e1e6;--red:#bd2c2c}
*{box-sizing:border-box}body{margin:0;padding:1rem;font:16px/1.45 system-ui,sans-serif;background:#fff;color:var(--ink)}
main{max-width:1040px;margin:auto;border:1px solid #aebdc7;border-radius:14px;padding:1rem}h1{font-size:clamp(1.25rem,4vw,2rem);margin:.1rem 0 .4rem}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}.control{padding:.7rem;background:#f4f7f9;border-radius:10px}
input[type=range],select{width:100%;min-height:2.5rem;accent-color:var(--accent)}output{font-weight:700;font-variant-numeric:tabular-nums}
canvas{width:100%;height:auto;border:1px solid var(--grid);border-radius:10px;margin-top:1rem;background:#fff}.readout{margin-top:.8rem;padding:.8rem;border-left:4px solid var(--accent);background:#f4f7f9}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0}.swatch{display:inline-block;width:.9rem;height:.9rem;margin-right:.25rem;border-radius:50%}
@media(max-width:620px){body{padding:.4rem}main{padding:.65rem}}
</style></head><body><main>
<h1>Коммутативная диаграмма эквивариантности</h1><p>Сравните два пути через слой. Параметр дефекта моделирует реализацию, которая не вполне коммутирует с действием группы.</p><div class="controls"><div class="control"><label for="angle">Преобразование входа</label><input id="angle" type="range" min="0" max="180" step="5" value="45"><output></output></div><div class="control"><label for="defect">Дефект слоя</label><input id="defect" type="range" min="0" max="1" step="0.02" value="0"><output></output></div></div><canvas id="plot" width="1000" height="560" role="img" aria-label="Два пути коммутативной диаграммы и дефект эквивариантности"></canvas><div class="readout" id="summary" aria-live="polite"></div><noscript><img src="../../geometric-deep-learning/interactive-gdl-equivariance.svg" alt="Статическая версия: Два пути коммутативной диаграммы и дефект эквивариантности"></noscript></main><script>
const C={blue:'#3f6480',pale:'#dbe6ed',accent:'#d9772f',ink:'#20313d',grid:'#d9e1e6',red:'#bd2c2c'};
function keys(el,draw){el.addEventListener('keydown',e=>{let d=(e.key==='ArrowRight'||e.key==='ArrowUp')?Number(el.step||1):(e.key==='ArrowLeft'||e.key==='ArrowDown')?-Number(el.step||1):0;if(d){e.preventDefault();el.value=String(Math.min(Number(el.max),Math.max(Number(el.min),Number(el.value)+d)));draw();}})}
function line(ctx,a,b,color=C.ink,width=2,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore()}
function dot(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
function label(ctx,t,x,y,color=C.ink,size=18){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.fillText(t,x,y)}

const ang=document.getElementById('angle'),def=document.getElementById('defect'),cv=document.getElementById('plot'),x=cv.getContext('2d'),s=document.getElementById('summary');
function arrow(a,b,c){line(x,a,b,c,3);dot(x,b[0],b[1],5,c)}function drawShape(cx,cy,t,c){x.save();x.translate(cx,cy);x.rotate(t);x.strokeStyle=c;x.lineWidth=4;x.beginPath();x.moveTo(-50,35);x.lineTo(0,-55);x.lineTo(50,35);x.lineTo(-50,35);x.stroke();x.restore()}
function draw(){let t=Number(ang.value)*Math.PI/180,e=Number(def.value);ang.nextElementSibling.value=`${ang.value}°`;def.nextElementSibling.value=e.toFixed(2);x.clearRect(0,0,cv.width,cv.height);label(x,'Преобразовать вход, затем применить слой',60,45,C.blue,22);label(x,'Сначала применить слой, затем преобразовать выход',510,45,C.blue,22);drawShape(160,190,t,C.blue);drawShape(160,410,0,C.blue);drawShape(840,190,t+e*.7,C.accent);drawShape(840,410,e*.7,C.accent);arrow([220,190],[770,190],C.blue);arrow([220,410],[770,410],C.blue);arrow([160,250],[160,350],C.ink);arrow([840,250],[840,350],C.ink);label(x,'g',125,310,C.ink,24);label(x,'g',805,310,C.ink,24);let gap=Math.round(110*e);line(x,[460,275-gap/2],[540,275+gap/2],e>.35?C.red:C.accent,8);label(x,`дефект эквивариантности: ${e.toFixed(2)}`,365,315,e>.35?C.red:C.accent,19);s.textContent=e<.05?'Диаграмма практически коммутирует: оба пути дают один результат.':`Два пути расходятся. Дефект ${e.toFixed(2)} показывает нарушение контракта эквивариантности.`}ang.oninput=draw;def.oninput=draw;keys(ang,draw);keys(def,draw);draw();
</script></body></html>
