<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Геометрия Lp</title><style>
:root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--ink:#172033;--muted:#64748b;--blue:#2563eb;--grid:#cbd5e1}*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 system-ui;background:var(--bg);color:var(--ink)}main{max-width:920px;margin:auto;background:var(--panel);padding:24px;border-radius:20px;box-shadow:0 12px 35px #0f172a18}h1{margin-top:0;font-size:1.55rem}.controls{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}input{width:100%}canvas{width:100%;height:auto;border:1px solid var(--grid);border-radius:16px;margin-top:18px;background:#fff}.legend{color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#f8fafc;--muted:#cbd5e1;--grid:#475569}canvas{background:#fff}}</style></head><body><main>
<h1>Единичный шар L<sup>p</sup></h1><p>Меняйте <em>p</em>: форма допустимого возмущения меняется даже при одинаковом радиусе.</p>
<div class="controls"><label for="p">p: <output id="pv">2.0</output></label><input id="p" type="range" min="1" max="10" step="0.1" value="2" aria-label="Показатель p"></div>
<canvas id="c" width="840" height="520" aria-label="График единичного шара Lp"></canvas><p class="legend">Синий контур: |x|<sup>p</sup>+|y|<sup>p</sup>=1. Пунктир: евклидова окружность для сравнения.</p>
<noscript><img src="../../functional-analysis/interactive-norms.svg" alt="Сравнение шаров L1, L2 и L∞"></noscript></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),r=document.querySelector('#p'),o=document.querySelector('#pv');function P(a,b){return[c.width/2+a*190,c.height/2-b*190]}function draw(){const p=+r.value;o.value=p.toFixed(1);x.clearRect(0,0,c.width,c.height);x.strokeStyle='#cbd5e1';x.lineWidth=1;for(let i=-2;i<=2;i++){let a=P(i,0),b=P(i,2);x.beginPath();x.moveTo(a[0],30);x.lineTo(a[0],490);x.stroke();a=P(0,i);x.beginPath();x.moveTo(40,a[1]);x.lineTo(800,a[1]);x.stroke()}x.setLineDash([8,7]);x.strokeStyle='#94a3b8';x.lineWidth=3;x.beginPath();x.arc(c.width/2,c.height/2,190,0,Math.PI*2);x.stroke();x.setLineDash([]);x.strokeStyle='#2563eb';x.fillStyle='#2563eb18';x.lineWidth=5;x.beginPath();for(let i=0;i<=720;i++){const t=2*Math.PI*i/720,ct=Math.cos(t),st=Math.sin(t),den=(Math.abs(ct)**p+Math.abs(st)**p)**(1/p),q=P(ct/den,st/den);i?x.lineTo(...q):x.moveTo(...q)}x.closePath();x.fill();x.stroke()}r.addEventListener('input',draw);draw();
</script></body></html>
