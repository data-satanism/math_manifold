<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Орбиты и инварианты</title><style>
:root{--blue:#3f6480;--pale:#dbe6ed;--accent:#d9772f;--ink:#20313d;--grid:#d9e1e6;--red:#bd2c2c}
*{box-sizing:border-box}body{margin:0;padding:1rem;font:16px/1.45 system-ui,sans-serif;background:#fff;color:var(--ink)}
main{max-width:1040px;margin:auto;border:1px solid #aebdc7;border-radius:14px;padding:1rem}h1{font-size:clamp(1.25rem,4vw,2rem);margin:.1rem 0 .4rem}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}.control{padding:.7rem;background:#f4f7f9;border-radius:10px}
input[type=range],select{width:100%;min-height:2.5rem;accent-color:var(--accent)}output{font-weight:700;font-variant-numeric:tabular-nums}
canvas{width:100%;height:auto;border:1px solid var(--grid);border-radius:10px;margin-top:1rem;background:#fff}.readout{margin-top:.8rem;padding:.8rem;border-left:4px solid var(--accent);background:#f4f7f9}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0}.swatch{display:inline-block;width:.9rem;height:.9rem;margin-right:.25rem;border-radius:50%}
@media(max-width:620px){body{padding:.4rem}main{padding:.65rem}}
</style></head><body><main>
<h1>Орбиты и инварианты</h1><p>Меняйте дискретизацию группы и начальную позу. Орбита хранит все эквивалентные представления объекта, а инвариантный признак склеивает их.</p><div class="controls"><div class="control"><label for="count">Число элементов группы</label><input id="count" type="range" min="4" max="24" step="1" value="12"><output></output></div><div class="control"><label for="angle">Начальная поза</label><input id="angle" type="range" min="0" max="180" step="5" value="20"><output></output></div></div><canvas id="plot" width="1000" height="560" role="img" aria-label="Орбита точки и инвариантное склеивание"></canvas><div class="readout" id="summary" aria-live="polite"></div><noscript><img src="../../geometric-deep-learning/interactive-gdl-orbits.svg" alt="Статическая версия: Орбита точки и инвариантное склеивание"></noscript></main><script>
const C={blue:'#3f6480',pale:'#dbe6ed',accent:'#d9772f',ink:'#20313d',grid:'#d9e1e6',red:'#bd2c2c'};
function keys(el,draw){el.addEventListener('keydown',e=>{let d=(e.key==='ArrowRight'||e.key==='ArrowUp')?Number(el.step||1):(e.key==='ArrowLeft'||e.key==='ArrowDown')?-Number(el.step||1):0;if(d){e.preventDefault();el.value=String(Math.min(Number(el.max),Math.max(Number(el.min),Number(el.value)+d)));draw();}})}
function line(ctx,a,b,color=C.ink,width=2,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore()}
function dot(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
function label(ctx,t,x,y,color=C.ink,size=18){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.fillText(t,x,y)}

const n=document.getElementById('count'),a=document.getElementById('angle'),cv=document.getElementById('plot'),x=cv.getContext('2d'),s=document.getElementById('summary');
function draw(){let N=Number(n.value),th=Number(a.value)*Math.PI/180;n.nextElementSibling.value=`${N} образов`;a.nextElementSibling.value=`${a.value}°`;x.clearRect(0,0,cv.width,cv.height);label(x,'Орбита точки под действием группы поворотов',45,42,C.blue,24);let cx=315,cy=285,R=180; x.strokeStyle=C.pale;x.lineWidth=5;x.beginPath();x.arc(cx,cy,R,0,2*Math.PI);x.stroke();for(let i=0;i<N;i++){let q=2*Math.PI*i/N+th;dot(x,cx+R*Math.cos(q),cy+R*Math.sin(q),8,i===0?C.accent:C.blue)}dot(x,cx,cy,6,C.ink);label(x,'один объект — множество представлений',560,105,C.ink,21);for(let i=0;i<5;i++){let q=2*Math.PI*i/5+th;let px=670+95*Math.cos(q),py=285+95*Math.sin(q);x.save();x.translate(px,py);x.rotate(q);x.fillStyle=i===0?C.accent:C.blue;x.fillRect(-28,-12,56,24);x.restore()}label(x,'Инвариантный признак склеивает орбиту в одну точку',520,470,C.blue,19);line(x,[690,390],[690,440],C.accent,3);dot(x,690,470,12,C.accent);s.textContent=`Орбита содержит ${N} дискретных образов. Изменение начального угла переставляет точки, но не меняет саму орбиту и инвариантный результат.`}n.oninput=draw;a.oninput=draw;keys(n,draw);keys(a,draw);draw();
</script></body></html>
