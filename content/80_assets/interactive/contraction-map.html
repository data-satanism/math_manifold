<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contraction map</title><style>
:root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--ink:#172033;--muted:#64748b}*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 system-ui;background:var(--bg);color:var(--ink)}main{max-width:920px;margin:auto;background:var(--panel);padding:24px;border-radius:20px;box-shadow:0 12px 35px #0f172a18}h1{margin-top:0;font-size:1.55rem}.controls{display:grid;grid-template-columns:1fr auto;gap:10px}input{width:100%}canvas{width:100%;height:auto;background:#fff;border-radius:16px;border:1px solid #cbd5e1;margin-top:18px}.muted{color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#f8fafc;--muted:#cbd5e1}}</style></head><body><main>
<h1>Итерации x<sub>n+1</sub>=q x<sub>n</sub>+b</h1><div class="controls"><label for="q">q: <output id="qv">0.60</output></label><input id="q" type="range" min="-0.95" max="0.95" step="0.05" value="0.6"><label for="x0">x₀: <output id="xv">-1.5</output></label><input id="x0" type="range" min="-2" max="2" step="0.1" value="-1.5"></div><canvas id="c" width="840" height="500" aria-label="Cobweb plot сжимающего отображения"></canvas><p id="msg" class="muted"></p><noscript><img src="../../functional-analysis/interactive-fixed-point.svg" alt="Итерации сжатия"></noscript></main><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),qr=document.querySelector('#q'),xr=document.querySelector('#x0'),qv=document.querySelector('#qv'),xv=document.querySelector('#xv'),m=document.querySelector('#msg'),b=.35;const S=150,O=420,px=x=>O+x*S,py=y=>O-y*S;function draw(){const q=+qr.value,x0=+xr.value,fix=b/(1-q);qv.value=q.toFixed(2);xv.value=x0.toFixed(1);g.clearRect(0,0,c.width,c.height);g.strokeStyle='#cbd5e1';g.lineWidth=1;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(px(i),80);g.lineTo(px(i),470);g.stroke();g.beginPath();g.moveTo(80,py(i));g.lineTo(780,py(i));g.stroke()}g.strokeStyle='#64748b';g.lineWidth=3;g.beginPath();g.moveTo(px(-2.2),py(-2.2));g.lineTo(px(2.2),py(2.2));g.stroke();g.strokeStyle='#2563eb';g.lineWidth=5;g.beginPath();g.moveTo(px(-2.2),py(q*-2.2+b));g.lineTo(px(2.2),py(q*2.2+b));g.stroke();let x=x0,y=0;g.strokeStyle='#7c3aed';g.lineWidth=3;g.beginPath();g.moveTo(px(x),py(0));for(let i=0;i<12;i++){y=q*x+b;g.lineTo(px(x),py(y));g.lineTo(px(y),py(y));x=y}g.stroke();g.fillStyle='#d97706';g.beginPath();g.arc(px(fix),py(fix),10,0,7);g.fill();m.textContent=`fixed point x* = ${fix.toFixed(3)}; error after 12 steps ≈ ${Math.abs(x-fix).toExponential(2)}`}[qr,xr].forEach(e=>e.addEventListener('input',draw));draw();
</script></body></html>
