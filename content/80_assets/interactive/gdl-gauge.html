<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калибровки и параллельный перенос</title><style>
:root{--blue:#3f6480;--pale:#dbe6ed;--accent:#d9772f;--ink:#20313d;--grid:#d9e1e6;--red:#bd2c2c}
*{box-sizing:border-box}body{margin:0;padding:1rem;font:16px/1.45 system-ui,sans-serif;background:#fff;color:var(--ink)}
main{max-width:1040px;margin:auto;border:1px solid #aebdc7;border-radius:14px;padding:1rem}h1{font-size:clamp(1.25rem,4vw,2rem);margin:.1rem 0 .4rem}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}.control{padding:.7rem;background:#f4f7f9;border-radius:10px}
input[type=range],select{width:100%;min-height:2.5rem;accent-color:var(--accent)}output{font-weight:700;font-variant-numeric:tabular-nums}
canvas{width:100%;height:auto;border:1px solid var(--grid);border-radius:10px;margin-top:1rem;background:#fff}.readout{margin-top:.8rem;padding:.8rem;border-left:4px solid var(--accent);background:#f4f7f9}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin:.7rem 0}.swatch{display:inline-block;width:.9rem;height:.9rem;margin-right:.25rem;border-radius:50%}
@media(max-width:620px){body{padding:.4rem}main{padding:.65rem}}
</style></head><body><main>
<h1>Калибровки и параллельный перенос</h1><p>Локальные координатные системы можно вращать независимо. Связность задаёт правило согласованного сравнения векторов вдоль пути.</p><div class="controls"><div class="control"><label for="twist">Смена локальной калибровки</label><input id="twist" type="range" min="0" max="180" step="5" value="70"><output></output></div><div class="control"><label for="connection">Компенсация связностью</label><input id="connection" type="range" min="0" max="1" step="0.05" value="0.85"><output></output></div></div><canvas id="plot" width="1000" height="560" role="img" aria-label="Локальные системы отсчёта и параллельный перенос"></canvas><div class="readout" id="summary" aria-live="polite"></div><noscript><img src="../../geometric-deep-learning/interactive-gdl-gauge.svg" alt="Статическая версия: Локальные системы отсчёта и параллельный перенос"></noscript></main><script>
const C={blue:'#3f6480',pale:'#dbe6ed',accent:'#d9772f',ink:'#20313d',grid:'#d9e1e6',red:'#bd2c2c'};
function keys(el,draw){el.addEventListener('keydown',e=>{let d=(e.key==='ArrowRight'||e.key==='ArrowUp')?Number(el.step||1):(e.key==='ArrowLeft'||e.key==='ArrowDown')?-Number(el.step||1):0;if(d){e.preventDefault();el.value=String(Math.min(Number(el.max),Math.max(Number(el.min),Number(el.value)+d)));draw();}})}
function line(ctx,a,b,color=C.ink,width=2,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.restore()}
function dot(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
function label(ctx,t,x,y,color=C.ink,size=18){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.fillText(t,x,y)}

const twist=document.getElementById('twist'),conn=document.getElementById('connection'),cv=document.getElementById('plot'),x=cv.getContext('2d'),s=document.getElementById('summary');
function frame(px,py,t,c){line(x,[px,py],[px+48*Math.cos(t),py+48*Math.sin(t)],c,4);line(x,[px,py],[px-36*Math.sin(t),py+36*Math.cos(t)],C.accent,4);dot(x,px,py,5,C.ink)}
function draw(){let tw=Number(twist.value)*Math.PI/180,k=Number(conn.value);twist.nextElementSibling.value=`${twist.value}°`;conn.nextElementSibling.value=k.toFixed(2);x.clearRect(0,0,cv.width,cv.height);label(x,'Локальные системы отсчёта вдоль поверхности',45,45,C.blue,23);x.strokeStyle=C.pale;x.lineWidth=12;x.beginPath();x.moveTo(90,360);x.bezierCurveTo(300,90,680,480,910,180);x.stroke();let pts=[];for(let i=0;i<7;i++){let q=i/6,px=90+820*q,py=360-210*q+90*Math.sin(q*2*Math.PI);pts.push([px,py]);frame(px,py,tw+q*k*2.2,C.blue)}for(let i=0;i<6;i++)line(x,pts[i],pts[i+1],C.ink,2,[6,6]);let mismatch=Math.abs(Math.sin(tw/2))*(1-k);label(x,'Параллельный перенос сравнивает векторы только после согласования калибровок',80,500,C.ink,19);s.textContent=k>.8?'Связность почти полностью компенсирует смену локальных калибровок: сравнение признаков согласовано.':`Остаточное рассогласование ≈ ${mismatch.toFixed(2)}. Без связности одинаковый геометрический вектор получает разные координаты.`}twist.oninput=draw;conn.oninput=draw;keys(twist,draw);keys(conn,draw);draw();
</script></body></html>
