<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Компактность</title><style>
:root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--ink:#172033;--muted:#64748b}*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 system-ui;background:var(--bg);color:var(--ink)}main{max-width:920px;margin:auto;background:var(--panel);padding:24px;border-radius:20px;box-shadow:0 12px 35px #0f172a18}h1{margin-top:0;font-size:1.55rem}.controls{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;background:#e2e8f0;color:#172033}button[aria-pressed=true]{background:#2563eb;color:white}canvas{width:100%;height:auto;background:white;border-radius:16px;border:1px solid #cbd5e1;margin-top:18px}.muted{color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#f8fafc;--muted:#cbd5e1}}</style></head><body><main>
<h1>Ограниченность ≠ компактность</h1><div class="controls" role="group" aria-label="Выбор последовательности"><button id="sep" aria-pressed="true">Разделённые точки</button><button id="conv" aria-pressed="false">Сходящаяся последовательность</button></div>
<canvas id="c" width="840" height="500" aria-label="Последовательности внутри ограниченного множества"></canvas><p id="msg" class="muted"></p><noscript><img src="../../functional-analysis/interactive-compactness.svg" alt="Разделённая и сходящаяся последовательности"></noscript></main><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),a=document.querySelector('#sep'),b=document.querySelector('#conv'),m=document.querySelector('#msg');let mode='sep';function draw(){g.clearRect(0,0,c.width,c.height);g.strokeStyle='#2563eb';g.lineWidth=4;g.beginPath();g.arc(420,255,180,0,Math.PI*2);g.stroke();if(mode==='sep'){for(let i=0;i<18;i++){const t=2*Math.PI*i/18;g.fillStyle='#7c3aed';g.beginPath();g.arc(420+145*Math.cos(t),255+145*Math.sin(t),8,0,7);g.fill()}m.textContent='Точки остаются на фиксированном расстоянии друг от друга: Cauchy-подпоследовательности нет.'}else{for(let i=0;i<18;i++){const q=.78**i,t=1.1*i;g.fillStyle=`rgba(15,118,110,${.35+.035*i})`;g.beginPath();g.arc(420+155*q*Math.cos(t),255+155*q*Math.sin(t),8,0,7);g.fill()}g.fillStyle='#d97706';g.beginPath();g.arc(420,255,11,0,7);g.fill();m.textContent='Точки накапливаются у центра: хвост последовательности становится сколь угодно тесным.'}}function set(v){mode=v;a.setAttribute('aria-pressed',v==='sep');b.setAttribute('aria-pressed',v==='conv');draw()}a.onclick=()=>set('sep');b.onclick=()=>set('conv');draw();
</script></body></html>
