<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Геометрия минимальной невязки</title><style>:root{--ink:#17324d;--muted:#6e879b;--line:#c8d6e2;--accent:#e66b19;--wash:#edf3f7}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 system-ui,sans-serif}.app{max-width:980px;margin:auto;padding:16px}.controls{display:flex;gap:18px;flex-wrap:wrap}.control{flex:1;min-width:220px}label{display:block;font-weight:650}input{width:100%}output{color:var(--accent)}canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px}.note{margin-top:10px;padding:10px 12px;background:var(--wash);border-left:3px solid var(--accent)}</style></head><body><main class="app"><div class="controls"><div class="control"><label for="angle">Направление образа подпространства: <output id="ao">25°</output></label><input id="angle" type="range" min="5" max="175" value="25"></div><div class="control"><label for="length">Длина начальной невязки: <output id="lo">1.00</output></label><input id="length" type="range" min="0.5" max="1.5" step="0.05" value="1"></div></div><canvas id="plot" width="940" height="500" role="img" aria-label="Ортогональная проекция начальной невязки и минимальный остаток"></canvas><div class="note" id="summary" aria-live="polite"></div></main><script>const c=plot,g=c.getContext('2d'),ink='#17324d',muted='#6e879b',line='#c8d6e2',accent='#e66b19';function arrow(a,b,c,d,col){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=2.5;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();let t=Math.atan2(d-b,c-a);g.beginPath();g.moveTo(c,d);g.lineTo(c-10*Math.cos(t-.45),d-10*Math.sin(t-.45));g.lineTo(c-10*Math.cos(t+.45),d-10*Math.sin(t+.45));g.fill()}function draw(){let th=+angle.value*Math.PI/180,L=+length.value;ao.value=angle.value+'°';lo.value=L.toFixed(2);g.clearRect(0,0,c.width,c.height);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);let ox=320,oy=360,rx=ox+210*L,ry=oy-235*L,ux=Math.cos(th),uy=-Math.sin(th);g.strokeStyle=line;g.lineWidth=18;g.beginPath();g.moveTo(ox-250*ux,oy-250*uy);g.lineTo(ox+470*ux,oy+470*uy);g.stroke();g.strokeStyle=ink;g.lineWidth=2;g.beginPath();g.moveTo(ox-250*ux,oy-250*uy);g.lineTo(ox+470*ux,oy+470*uy);g.stroke();let vx=rx-ox,vy=ry-oy,t=vx*ux+vy*uy,px=ox+t*ux,py=oy+t*uy;arrow(ox,oy,rx,ry,ink);arrow(ox,oy,px,py,muted);arrow(px,py,rx,ry,accent);g.strokeStyle=muted;g.setLineDash([6,5]);g.beginPath();g.moveTo(px,py);g.lineTo(rx,ry);g.stroke();g.setLineDash([]);g.fillStyle=ink;g.font='17px system-ui';g.fillText('начальная невязка',rx+12,ry);g.fillText('образ крыловского подпространства',420,420);g.fillStyle=accent;g.fillText('минимальная невязка',px+12,(py+ry)/2);let res=Math.hypot(rx-px,ry-py)/235;summary.textContent=`Длина минимального остатка: ${res.toFixed(3)}. Он перпендикулярен образу подпространства; любая другая поправка добавит к нему ненулевую компоненту вдоль этого образа.`}document.querySelectorAll('input').forEach(e=>e.addEventListener('input',draw));draw();</script></body></html>
