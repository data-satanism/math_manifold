<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Частотные режимы циркулянта</title>
<style>body{margin:0;background:#f8fafc;color:#172b4d;font:16px system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #9eb3c7;border-radius:12px;padding:16px}h1{font-size:24px}.controls{display:flex;gap:20px;flex-wrap:wrap}.controls label{display:grid;gap:5px;font-weight:650}input[type=range]{width:220px}canvas{width:100%;height:430px;border:1px solid #c8d4df;border-radius:8px;margin-top:14px}.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}.tag{background:#e9f1f7;padding:7px 11px;border-radius:8px}.warn{color:#a33b2b}input:focus{outline:3px solid #e78b39}</style></head>
<body><main class="wrap"><h1>Циркулянт как набор частотных множителей</h1><section class="panel"><div class="controls"><label>Частота входа: <span id="kOut">3</span><input id="freq" type="range" min="1" max="12" value="3"></label><label>Множитель режима: <span id="mOut">1.40</span><input id="mult" type="range" min="0" max="220" value="140"></label><label><span>Граница</span><span><input id="nonperiodic" type="checkbox"> непериодический сигнал</span></label></div><canvas id="plot" width="920" height="430" aria-label="Входной и выходной частотные режимы"></canvas><div class="stats"><span class="tag">Выбранный канал: <b id="channel"></b></span><span class="tag">Усиление энергии: <b id="gain"></b></span><span class="tag warn" id="warning"></span></div></section></main>
<script>
const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d'),freq=document.getElementById('freq'),mult=document.getElementById('mult'),nonperiodic=document.getElementById('nonperiodic'),kOut=document.getElementById('kOut'),mOut=document.getElementById('mOut'),channel=document.getElementById('channel'),gain=document.getElementById('gain'),warning=document.getElementById('warning');const L=55,W=835;function wave(base,amp,k,color,trend,label){ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<=600;i++){const x=i/600,y=amp*Math.sin(2*Math.PI*k*x)+(trend?.45*(x-.5):0);const px=L+x*W,py=base-y*75;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();ctx.fillStyle=color;ctx.font='16px system-ui';ctx.fillText(label,L,base-95)}
function draw(){const k=+freq.value,m=+mult.value/100,np=nonperiodic.checked;kOut.textContent=k;mOut.textContent=m.toFixed(2);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#b5c1cc';[145,345].forEach(y=>{ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+W,y);ctx.stroke()});wave(145,1,k,'#183f72',np,'входной режим');wave(345,m,k,'#e27832',np,'после спектрального множителя');ctx.setLineDash([5,5]);ctx.strokeStyle='#b44331';ctx.strokeRect(L,42,16,306);ctx.strokeRect(L+W-16,42,16,306);ctx.setLineDash([]);channel.textContent='k = '+k;gain.textContent=(m*m).toFixed(2);warning.textContent=np?'Непериодическая граница создаёт разрыв при циклической обёртке.':''}
freq.oninput=mult.oninput=nonperiodic.onchange=draw;draw();
</script></body></html>
