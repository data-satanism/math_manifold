<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гильбертова проекция</title><style>
:root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--ink:#172033;--muted:#64748b}*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 system-ui;background:var(--bg);color:var(--ink)}main{max-width:920px;margin:auto;background:var(--panel);padding:24px;border-radius:20px;box-shadow:0 12px 35px #0f172a18}h1{margin-top:0;font-size:1.55rem}canvas{width:100%;height:auto;background:#fff;border-radius:16px;border:1px solid #cbd5e1;touch-action:none}.muted{color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--ink:#f8fafc;--muted:#cbd5e1}}</style></head><body><main>
<h1>Ортогональная проекция</h1><p>Перетаскивайте фиолетовую точку. Синяя точка — ближайший элемент подпространства, пунктирная ошибка ортогональна линии.</p><canvas id="c" width="840" height="500" tabindex="0" aria-label="Интерактивная ортогональная проекция"></canvas><p id="msg" class="muted"></p><noscript><img src="../../functional-analysis/interactive-projection.svg" alt="Ортогональная проекция"></noscript></main><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),m=document.querySelector('#msg');let p={x:620,y:120},drag=false;const A={x:110,y:410},B={x:760,y:230};function proj(){const vx=B.x-A.x,vy=B.y-A.y,t=((p.x-A.x)*vx+(p.y-A.y)*vy)/(vx*vx+vy*vy);return{x:A.x+t*vx,y:A.y+t*vy}}function draw(){g.clearRect(0,0,c.width,c.height);g.strokeStyle='#0f766e';g.lineWidth=7;g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke();const q=proj();g.setLineDash([9,8]);g.strokeStyle='#7c3aed';g.lineWidth=4;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke();g.setLineDash([]);g.fillStyle='#2563eb';g.beginPath();g.arc(q.x,q.y,11,0,7);g.fill();g.fillStyle='#7c3aed';g.beginPath();g.arc(p.x,p.y,14,0,7);g.fill();m.textContent=`‖x−Pₘx‖ = ${Math.hypot(p.x-q.x,p.y-q.y).toFixed(1)} условных единиц`; }function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);p=pos(e);draw()};c.onpointermove=e=>{if(drag){p=pos(e);draw()}};c.onpointerup=()=>drag=false;c.onkeydown=e=>{const s=e.shiftKey?10:3;if(e.key==='ArrowLeft')p.x-=s;if(e.key==='ArrowRight')p.x+=s;if(e.key==='ArrowUp')p.y-=s;if(e.key==='ArrowDown')p.y+=s;draw()};draw();
</script></body></html>
